<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lumen Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Admin page: overview of everyone's progress, who may use Lumen, and what the weekly task should write. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --surface-2: #e6ecea; --text: #17211d; --muted: #52605a; --line: #d2dad6;
  --accent: #0f6b5f; --on-accent: #ffffff; --good: #1a6b41; --warn: #7d5200; --warn-soft: #faefd6; --danger: #a8281f;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #181f1c; --surface-2: #232c28; --text: #e7edea; --muted: #a2afa9; --line: #2f3a35;
    --accent: #72cdb9; --on-accent: #06211c; --good: #7fd4a0; --warn: #e6bd6b; --warn-soft: #33280e; --danger: #f1a39d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #181f1c; --surface-2: #232c28; --text: #e7edea; --muted: #a2afa9; --line: #2f3a35;
  --accent: #72cdb9; --on-accent: #06211c; --good: #7fd4a0; --warn: #e6bd6b; --warn-soft: #33280e; --danger: #f1a39d; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 1rem; line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 64rem; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { font-family: var(--font-read); font-size: 1.5rem; }
.muted, .hint { color: var(--muted); }
.hint { font-size: .8125rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 1.0625rem; }
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 12px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; min-height: 42px; padding: 4px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 11px; border: 1px solid transparent; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: .875rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .875rem; font-weight: 600; }
input[type="email"], input[type="password"], input[type="text"], textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
}
textarea { min-height: 80px; resize: vertical; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.kpi b { display: block; font-size: 1.625rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { color: var(--muted); font-size: .8125rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8125rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 9px; }
.seg button { min-height: 32px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: .8125rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; background: var(--surface-2); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.error { color: var(--danger); font-size: .875rem; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .875rem; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 9; max-width: calc(100% - 32px); }
@media (max-width: 40rem) {
  .hide-sm { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .tabs button { padding: 4px 6px; font-size: .875rem; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 14px; }
  th, td { padding: 8px 6px; }
  header h1 { font-size: 1.25rem; }
}
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
select { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 2px 8px; }
table.click tbody tr { cursor: pointer; }
table.click tbody tr:hover, tr.sel { background: var(--surface-2); }
button.sort { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
button.sort.on { color: var(--text); text-decoration: underline; }
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 140px; }
.chart .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 2px; }
.chart .col i { display: block; width: 70%; background: var(--accent); border-radius: 4px 4px 0 0; }
.chart .v, .chart .d { font-size: .6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
.strip i { display: block; height: 14px; border-radius: 3px; background: var(--surface-2); }
.strip i.on { background: var(--accent); }
.fact h3 { font-family: var(--font-read); font-size: 1.125rem; }
.fact.retired { opacity: .6; }
.quiz { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.quiz ol { margin: 6px 0; padding-left: 22px; }
.quiz li.right { font-weight: 650; color: var(--good); }
.news ul { margin: 4px 0 10px; padding-left: 20px; }
.person .kpis { grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="lumen-cloud.js"></script>
<script>
(function () {
  'use strict';
  const C = window.LumenCloud;
  const AREAS = [
    ['geld', 'Geld & Finanzen'], ['recht', 'Recht & Verträge (Österreich)'], ['gesundheit', 'Körper, Gesundheit & Psyche'],
    ['haushalt', 'Haushalt, Kochen & Hacks'], ['digital', 'Digitale Sicherheit & Internet'], ['verkehr', 'Auto, Verkehr & Reisen'],
    ['tech', 'Tech & Geräte'], ['erklaert', 'Wie funktioniert das?'], ['natur', 'Natur & Wissenschaft'],
    ['geschichte', 'Geschichte & Politik'], ['kultur', 'Geografie, Kultur & Sprache'], ['denken', 'Denken, Psychologie & Kommunikation']
  ];
  const AREA_NAME = {};
  AREAS.forEach(function (a) { AREA_NAME[a[0]] = a[1]; });
  const DEFAULT_TIMES = { morgen: '07:00', mittag: '12:00', abend: '18:00' };
  const TABS = [['overview', 'Übersicht'], ['people', 'Personen'], ['settings', 'Für alle'], ['facts', 'Fakten'], ['reports', 'Meldungen'], ['weekly', 'Wochenaufgabe']];
  const S = {
    phase: 'boot', user: null, tab: 'overview', access: null, pub: null, members: {}, digests: {}, manifest: null,
    form: { email: '', password: '', error: '', busy: false }, titles: {}, weights: null, wish: null, busy: false,
    sel: null, sort: 'lastSeen', day: null, dayDoc: null, edit: null, runs: null, newsList: null, notice: '', times: null
  };
  const $ = function (id) { return document.getElementById(id); };
  function h(tag, attrs) {
    const el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'disabled' || k === 'checked') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (let i = 2; i < arguments.length; i += 1) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  const btn = function (label, kind, onclick, disabled) { return h('button', { type: 'button', class: 'btn ' + kind, text: label, onclick: onclick, disabled: !!disabled }); };
  let toastTimer = 0;
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3500); }
  const todayVienna = function () { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); };
  function addDays(d, n) { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function fmtDay(d, long) {
    if (!d) return '–';
    const t = new Date(String(d).slice(0, 10) + 'T12:00:00Z');
    return t.toLocaleDateString('de-AT', long ? { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' } : { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  const norm = function (e) { return String(e || '').trim().toLowerCase(); };
  const nowISO = function () { return new Date().toISOString(); };
  const errText = function (e) { return (e && e.code) || 'Fehler'; };

  /* ---------- auth ---------- */

  function boot() {
    render();
    if (!C || !C.ready) { S.phase = 'error'; render(); return; }
    C.auth.onAuthStateChanged(function (u) {
      S.user = u;
      if (!u) { S.phase = 'signin'; render(); return; }
      if (!u.emailVerified) { S.phase = 'verify'; render(); return; }
      load();
    });
  }
  async function signIn() {
    const F = S.form;
    F.busy = true; F.error = ''; render();
    try { await C.auth.signInWithEmailAndPassword(F.email.trim(), F.password); F.password = ''; }
    catch (e) { F.error = C.message(e); }
    F.busy = false; render();
  }
  function signOut() { C.auth.signOut().then(function () { location.reload(); }); }

  /* ---------- data ---------- */

  async function load() {
    S.phase = 'loading'; render();
    try {
      const acc = await C.db.doc('config/access').get();
      S.access = Object.assign({ adminEmails: [], invited: [] }, acc.exists ? acc.data() : {});
    } catch (e) {
      S.phase = e && e.code === 'permission-denied' ? 'denied' : 'error';
      render();
      return;
    }
    try {
      const got = await Promise.all([
        C.db.doc('config/public').get(), C.db.collection('members').get(), C.db.collection('digest').get(),
        C.content.manifest(true).catch(function () { return null; })
      ]);
      S.pub = got[0].exists ? got[0].data() : {};
      S.members = {}; got[1].docs.forEach(function (d) { S.members[d.id] = d.data(); });
      S.digests = {}; got[2].docs.forEach(function (d) { S.digests[d.id] = d.data(); });
      S.manifest = got[3] || { days: [], news: [], runs: [], idx: [] };
      S.weights = Object.assign({}, S.pub.areaWeights || {});
      S.wish = S.pub.wish || '';
      S.notice = (S.pub.notice && S.pub.notice.text) || '';
      S.times = Object.assign({}, DEFAULT_TIMES, S.pub.defaultTimes || {});
      C.content.setOverrides(S.pub.overrides);
      S.phase = 'ready';
      loadTitles();
    } catch (e) { S.phase = 'error'; }
    render();
  }
  function allReports() {
    const out = [];
    Object.keys(S.digests).forEach(function (uid) {
      (S.digests[uid].reports || []).forEach(function (r) { out.push(Object.assign({ uid: uid }, r)); });
    });
    return out.sort(function (a, b) { return String(a.reportedAt) < String(b.reportedAt) ? 1 : -1; });
  }
  const handled = function (r) { const u = S.manifest && S.manifest.reportsHandledUntil; return !!(u && r.reportedAt && r.reportedAt <= u); };
  const forwarded = function (r) { return (S.pub.reports || []).some(function (x) { return x.factId === r.factId && x.reportedAt === r.reportedAt; }); };
  async function loadTitles() {
    const days = {};
    allReports().forEach(function (r) { days[String(r.factId).slice(0, 10)] = true; });
    Object.keys(S.pub.overrides || {}).forEach(function (id) { days[id.slice(0, 10)] = true; });
    await Promise.all(Object.keys(days).map(function (d) {
      return C.content.day(d).then(function (doc) {
        Object.keys((doc && doc.items) || {}).forEach(function (k) { S.titles[doc.items[k].id] = doc.items[k].title; });
      }).catch(function () {});
    }));
    render();
  }
  async function savePublic(patch, msg) {
    S.busy = true; render();
    try {
      await C.db.doc('config/public').set(Object.assign({ updatedAt: nowISO() }, patch), { merge: true });
      Object.keys(patch).forEach(function (k) {
        S.pub[k] = (S.pub[k] && typeof S.pub[k] === 'object' && !Array.isArray(S.pub[k]) && patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]))
          ? Object.assign({}, S.pub[k], patch[k]) : patch[k];
      });
      toast(msg);
    } catch (e) { toast('Speichern hat nicht geklappt: ' + errText(e)); }
    S.busy = false; render();
  }
  async function saveAccess(patch, msg) {
    S.busy = true; render();
    try {
      await C.db.doc('config/access').set(patch, { merge: true });
      Object.assign(S.access, patch);
      toast(msg || 'Gespeichert.');
    } catch (e) { toast('Speichern hat nicht geklappt: ' + errText(e)); }
    S.busy = false; render();
  }
  async function deletePersonData(uid) {
    S.busy = true; render();
    try {
      const snap = await C.db.collection('data/users/' + uid).get();
      await Promise.all(snap.docs.map(function (d) { return C.db.doc('data/users/' + uid + '/' + d.id).delete(); }));
      await C.db.doc('digest/' + uid).delete();
      await C.db.doc('members/' + uid).delete();
      await C.db.doc('friends/' + uid).delete().catch(function () {});
      await C.db.doc('push/' + uid).delete().catch(function () {});
      delete S.digests[uid]; delete S.members[uid];
      S.sel = null;
      toast('Daten gelöscht. Das Anmeldekonto selbst löschst du in der Firebase-Konsole unter Authentication.');
    } catch (e) { toast('Löschen hat nicht geklappt: ' + errText(e)); }
    S.busy = false; render();
  }

  /* ---------- people ---------- */

  function personRows() {
    const ids = Object.keys(Object.assign({}, S.members, S.digests));
    return ids.map(function (uid) {
      const m = S.members[uid] || {}, d = S.digests[uid] || {};
      let right = 0, total = 0;
      Object.keys(d.areaAccuracy || {}).forEach(function (k) {
        const a = d.areaAccuracy[k];
        if (a && a.answered && a.pct !== null) { right += a.pct * a.answered / 100; total += a.answered; }
      });
      const email = norm(m.email);
      return { uid: uid, name: m.name || d.name || '', email: m.email || '', lastSeen: m.lastSeen || d.lastDay || '', streak: d.streak || 0,
        learned: d.seenCount || 0, answered: d.answered || 0, pct: total ? Math.round(100 * right / total) : null, reports: (d.reports || []).length,
        known: (d.knownIds || []).length, due: d.dueCount || 0, start: d.startDate || '', active: d.activeDays || [],
        admin: S.access.adminEmails.indexOf(email) !== -1, invited: S.access.invited.indexOf(email) !== -1 || S.access.adminEmails.indexOf(email) !== -1 };
    });
  }
  function sortedRows() {
    const rows = personRows(), k = S.sort;
    return rows.sort(function (a, b) {
      if (k === 'name') return (a.name || a.email).localeCompare(b.name || b.email, 'de');
      const x = a[k], y = b[k];
      if (x === y) return 0;
      if (x === null || x === undefined || x === '') return 1;
      if (y === null || y === undefined || y === '') return -1;
      return x < y ? 1 : -1;
    });
  }
  function exportCsv() {
    const rows = sortedRows();
    const head = ['Name', 'E-Mail', 'Start', 'Zuletzt da', 'Serie', 'Gelernt', 'Antworten', 'Richtig %', 'Bekannt', 'Fällig', 'Meldungen', 'Aktive Tage (30)'];
    const esc = function (v) { const s = v === null || v === undefined ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [head.join(';')].concat(rows.map(function (r) {
      return [r.name, r.email, r.start, r.lastSeen, r.streak, r.learned, r.answered, r.pct, r.known, r.due, r.reports, r.active.length].map(esc).join(';');
    }));
    const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
    const a = h('a', { href: url, download: 'lumen-personen-' + todayVienna() + '.csv', style: 'display:none' });
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  /* ---------- views ---------- */

  function render() {
    const root = $('root');
    root.textContent = '';
    root.appendChild(h('header', {}, h('h1', { text: 'Lumen Admin' }),
      S.user && S.phase !== 'signin' ? h('div', { class: 'row' }, h('a', { href: './', class: 'muted', text: 'Zur Lernseite' }), h('span', { class: 'muted hide-sm', text: S.user.email }), btn('Abmelden', 'secondary small', signOut)) : null));
    if (S.phase === 'signin') { root.appendChild(signinCard()); return; }
    if (S.phase === 'verify') { root.appendChild(h('div', { class: 'card' }, h('h2', { text: 'E-Mail-Adresse noch nicht bestätigt' }), h('p', { class: 'muted', text: 'Bestätige zuerst deine Adresse über die Lernseite und lade diese Seite dann neu.' }))); return; }
    if (S.phase === 'denied') { root.appendChild(h('div', { class: 'card' }, h('h2', { text: 'Kein Admin-Zugang' }), h('p', { class: 'muted', text: 'Dieses Konto ist kein Admin.' }), h('a', { href: './', text: 'Zur Lernseite' }))); return; }
    if (S.phase === 'error') { root.appendChild(h('div', { class: 'card' }, h('h2', { text: 'Die Daten sind gerade nicht erreichbar' }), btn('Erneut versuchen', 'primary', load))); return; }
    if (S.phase !== 'ready') { root.appendChild(h('p', { class: 'muted', text: 'Lädt …' })); return; }
    const open = allReports().filter(function (r) { return !handled(r); }).length;
    root.appendChild(h('div', { class: 'tabs', role: 'group', 'aria-label': 'Bereich' },
      TABS.map(function (t) {
        return h('button', { type: 'button', text: t[1] + (t[0] === 'reports' && open ? ' (' + open + ')' : ''), 'aria-pressed': String(S.tab === t[0]), onclick: function () { S.tab = t[0]; render(); } });
      })));
    const view = { overview: overview, people: people, settings: forAll, facts: facts, reports: reports, weekly: weekly }[S.tab];
    add(root, view());
  }
  function signinCard() {
    const F = S.form;
    const field = function (label, key, type, auto) {
      return h('label', { class: 'field' }, h('span', { text: label }), h('input', { type: type, value: F[key], autocomplete: auto,
        oninput: function (e) { F[key] = e.target.value; }, onkeydown: function (e) { if (e.key === 'Enter') signIn(); } }));
    };
    return h('div', { class: 'card', style: 'max-width:26rem' }, h('h2', { text: 'Anmelden' }),
      field('E-Mail', 'email', 'email', 'username'), field('Passwort', 'password', 'password', 'current-password'),
      F.error ? h('p', { class: 'error', role: 'alert', text: F.error }) : null,
      btn(F.busy ? 'Einen Moment …' : 'Anmelden', 'primary', signIn, F.busy),
      h('p', { class: 'hint', text: 'Dasselbe Konto wie auf der Lernseite. Ein Konto anlegen oder das Passwort zurücksetzen geht dort.' }));
  }
  function kpi(value, label) { return h('div', { class: 'kpi' }, h('b', { text: String(value) }), h('span', { text: label })); }

  function overview() {
    const rows = personRows(), t = todayVienna(), week = addDays(t, -6);
    const activeToday = rows.filter(function (r) { return r.lastSeen === t || r.active.indexOf(t) !== -1; }).length;
    const active7 = rows.filter(function (r) { return r.lastSeen >= week; }).length;
    const learned = rows.reduce(function (s, r) { return s + r.learned; }, 0);

          if (new Set(opts.map(function (o) { return o.toLowerCase(); })).size !== 4) { toast('Die vier Antworten müssen verschieden sein.'); return; }
          const o = { title: E.title.trim().slice(0, 60), text: E.text.trim(), mnemonic: E.mnemonic.trim(),
            quiz: { question: E.question.trim(), options: opts, correct: E.correct, explanation: E.explanation.trim() },
            correction: { at: nowISO(), summary: 'Vom Admin überarbeitet.' }, adminEdited: true, retired: false };
          setOverride(f.id, o, 'Gespeichert. Gilt sofort für alle.');
        }, S.busy),
        btn('Abbrechen', 'secondary', function () { S.edit = null; render(); })));
  }
  async function setOverride(id, value, msg) {
    const next = Object.assign({}, S.pub.overrides || {});
    if (value) next[id] = value; else delete next[id];
    S.busy = true; render();
    try {
      // The whole map is written so that removed entries disappear too.
      await C.db.doc('config/public').set({ overrides: next, overridesChangedAt: nowISO(), updatedAt: nowISO() }, { merge: true });
      S.pub.overrides = next;
      C.content.setOverrides(next);
      S.edit = null;
      toast(msg);
      if (S.day) { const d = S.day; S.day = null; openDay(d); }
    } catch (e) { toast('Speichern hat nicht geklappt: ' + errText(e)); }
    S.busy = false; render();
  }

  /* ---------- reports ---------- */

  function reports() {
    const list = allReports(), open = list.filter(function (r) { return !handled(r); });
    const toSend = open.filter(function (r) { return !forwarded(r); });
    return [h('div', { class: 'card' }, h('h2', { text: 'Fehlermeldungen' }),
      h('p', { class: 'hint', text: 'Du kannst einen Fakt sofort selbst korrigieren oder ausblenden (über „Fakt öffnen“) oder die Meldung an die Wochenaufgabe weitergeben. Die prüft am Sonntag mit Quellen. Sie bekommt nur Fakt und Hinweis, keine Namen.' }),
      h('div', { class: 'row' }, btn(toSend.length ? toSend.length + ' offene Meldung' + (toSend.length === 1 ? '' : 'en') + ' weitergeben' : 'Alles weitergegeben', 'primary', function () {
        const keep = (S.pub.reports || []).filter(function (x) { return !handled(x); });
        const next = keep.concat(toSend.map(function (r) { return { factId: r.factId, note: String(r.note || '').slice(0, 200), reportedAt: r.reportedAt }; })).slice(-60);
        savePublic({ reports: next }, 'Weitergegeben. Die Wochenaufgabe prüft sie am Sonntag.');
      }, S.busy || !toSend.length)),
      list.length ? h('div', { class: 'tablewrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Gemeldet' }), h('th', { text: 'Fakt' }), h('th', { text: 'Hinweis' }), h('th', { text: 'Von' }), h('th', { text: 'Stand' }), h('th'))),
        h('tbody', {}, list.map(function (r) {
          const who = S.members[r.uid] || {};
          return h('tr', {}, h('td', { text: fmtDay(r.reportedAt) }), h('td', { text: S.titles[r.factId] || r.factId }), h('td', { text: r.note || '–' }),
            h('td', { text: who.name || who.email || '–' }),
            h('td', {}, h('span', { class: 'tag' + (handled(r) ? '' : ' warn'), text: handled(r) ? 'bearbeitet' : (forwarded(r) ? 'weitergegeben' : 'neu') })),
            h('td', {}, btn('Fakt öffnen', 'secondary small', function () { S.tab = 'facts'; openDay(String(r.factId).slice(0, 10)); })));
        })))) : h('p', { class: 'muted', text: 'Keine Meldungen.' }))];
  }

  /* ---------- weekly task ---------- */

  function nextSunday() {
    const t = todayVienna(), wd = new Date(t + 'T12:00:00Z').getUTCDay();
    return addDays(t, (7 - wd) % 7);
  }
  function weekly() {
    const m = S.manifest;
    if (!S.runs) {
      S.runs = [];
      Promise.all((m.runs || []).slice(-8).reverse().map(function (id) {
        return fetch('data/runs/' + id + '.json?v=' + encodeURIComponent(m.updatedAt || '')).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      })).then(function (list) { S.runs = list.filter(Boolean); render(); });
      C.content.news(6).then(function (list) { S.newsList = list; render(); }).catch(function () {});
    }
    return [
      h('div', { class: 'card' }, h('h2', { text: 'Wochenaufgabe' }),
        h('p', {}, 'Läuft jeden Sonntag um 11:07 Uhr (Sommerzeit 12:07 Uhr). Nächster Lauf: ', h('b', { text: fmtDay(nextSunday(), true) }), '.'),
        h('p', { class: 'hint', text: 'Sie füllt den Vorrat auf mindestens vier Wochen auf, prüft weitergegebene Fehlermeldungen, schreibt „Aktuell“ und übernimmt deine Korrekturen. Was sie liest: deine Themen-Gewichte, den Themenwunsch und die weitergegebenen Meldungen.' }),
        h('div', { class: 'kpis' }, kpi(m.lastDate ? fmtDay(m.lastDate) : '–', 'Vorrat reicht bis'), kpi((m.days || []).length * 5, 'Fakten im Archiv'), kpi((m.news || []).length, 'Ausgaben „Aktuell“'))),
      h('div', { class: 'card' }, h('h2', { text: 'Letzte Läufe' }),
        S.runs && S.runs.length ? h('div', { class: 'tablewrap' }, h('table', {},
          h('thead', {}, h('tr', {}, h('th', { text: 'Lauf' }), h('th', { class: 'num', text: 'neu' }), h('th', { text: 'Vorrat bis' }), h('th', { text: 'Aktuell' }), h('th', { text: 'Notiz' }))),
          h('tbody', {}, S.runs.map(function (r) {
            return h('tr', {}, h('td', { text: fmtDay(r.at || r.date) }), h('td', { class: 'num', text: String(r.added || 0) }), h('td', { text: fmtDay(r.lastDate) }),
              h('td', { text: r.newsDate ? 'ja' : 'nein' }), h('td', { class: 'hint', text: r.notes || '' }));
          })))) : h('p', { class: 'muted', text: 'Lädt …' })),
      h('div', { class: 'card' }, h('h2', { text: 'Ausgaben „Aktuell“' }),
        S.newsList && S.newsList.length ? S.newsList.map(function (n) {
          return h('div', { class: 'news' }, h('p', {}, h('b', { text: fmtDay(n.date, true) })), h('ul', {}, (n.items || []).map(function (it) {
            return h('li', {}, it.title + ' ', it.source && it.source.url ? h('a', { href: it.source.url, target: '_blank', rel: 'noopener noreferrer', text: '(' + (it.source.name || 'Quelle') + ')' }) : null);
          })));
        }) : h('p', { class: 'muted', text: 'Noch keine Ausgabe.' }))
    ];
  }

  boot();
})();
</script>
