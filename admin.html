<style>
/* Admin page: overview of everyone's progress, who may use Lumen, and what the weekly task should write. */
:root {
  --bg: #f2f2f7; --surface: #ffffff; --surface-2: #e9e9ee; --seg-on: #ffffff; --text: #000000; --muted: #6c6c70; --line: rgba(60, 60, 67, .18);

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: var(--font-ui);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --seg-on: #636366; --text: #ffffff; --muted: #98989f; --line: rgba(84, 84, 88, .55);
    --accent: #ff9f0a; --on-accent: #000000; --good: #30d158; --warn: #ffb340; --warn-soft: #33260f; --danger: #ff6961; color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-theme="black"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --seg-on: #636366; --text: #ffffff; --muted: #98989f; --line: rgba(84, 84, 88, .55);
  --accent: #ff9f0a; --on-accent: #000000; --good: #30d158; --warn: #ffb340; --warn-soft: #33260f; --danger: #ff6961; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Always keep room for the scrollbar, so the page does not shift sideways between short and long tabs. */
html { scrollbar-gutter: stable; }
[hidden] { display: none !important; }

.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: .875rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .875rem; font-weight: 600; }
input[type="email"], input[type="password"], input[type="text"], textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
}

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 10px; }

.tablewrap { overflow-x: auto; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 80px; }

.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 9px; }
.seg button { min-height: 32px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: .8125rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; background: var(--surface-2); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--accent-soft, var(--surface-2)); color: var(--accent); }
input[type="number"], input[type="date"] { width: 100%; min-height: 44px; padding: 10px 14px; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--text); font: inherit; font-size: max(1rem, 16px); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 9; max-width: calc(100% - 32px); }
@media (max-width: 40rem) {
  .hide-sm { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .tabs button { padding: 4px 6px; font-size: .875rem; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 14px; }
  th, td { padding: 8px 6px; }

}
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
select { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 2px 8px; }
table.click tbody tr { cursor: pointer; }
table.click tbody tr:hover, tr.sel { background: var(--surface-2); }
button.sort { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
button.sort.on { color: var(--text); text-decoration: underline; }
.chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 140px; }
.chart .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 2px; }
.chart .col i { display: block; width: 70%; background: var(--accent); border-radius: 4px 4px 0 0; }
.chart .v, .chart .d { font-size: .6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
.strip i { display: block; height: 14px; border-radius: 3px; background: var(--surface-2); }
.strip i.on { background: var(--accent); }
.fact h3 { font-family: var(--font-read); font-size: 1.125rem; }
.fact.retired { opacity: .6; }
.quiz { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.quiz ol { margin: 6px 0; padding-left: 22px; }
.quiz li.right { font-weight: 650; color: var(--good); }
.news ul { margin: 4px 0 10px; padding-left: 20px; }
.person .kpis { grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.planrow { display: grid; grid-template-columns: minmax(0, 1fr) 112px 118px; align-items: center; gap: 8px; max-width: 26rem; }
.planrow .wide { grid-column: 1 / 3; }
.planrow input[type="time"] { width: 100%; min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); }
.stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; background: var(--surface-2); border-radius: 11px; }
.stepper button { height: 44px; padding: 0; border: 0; background: transparent; font-size: 1.25rem; cursor: pointer; }
.stepper button[disabled] { opacity: .3; cursor: default; }
.stepper output { text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
.wrap { padding-top: max(16px, calc(env(safe-area-inset-top, 0px) + 14px)); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px); }
header h1 { font-size: 2.125rem; font-weight: 800; letter-spacing: -.022em; line-height: 1.08; }
.card { border: 0; border-radius: 22px; }
.kpi { border: 0; border-radius: 18px; }
.btn { border: 0; border-radius: 999px; }
.btn.danger { border: 1px solid var(--danger); }
.tabs { border-radius: 18px; }
.tabs button { border-radius: 14px; }
.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--seg-on); }
input[type="email"], input[type="password"], input[type="text"], textarea, select, .planrow input[type="time"] { border: 0; border-radius: 14px; background: var(--surface-2); font-size: max(1rem, 16px); }
@media (max-width: 40rem) { header h1 { font-size: 1.875rem; } }
.usage-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: .5px solid var(--line); }
.usage-row:first-of-type { border-top: 0; padding-top: 0; }
.usage-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.usage-row .hint { margin: 0; }
.usage-bar { height: 8px; border-radius: 4px; }
.usage-bar i { background: var(--good); }
.usage-bar.warn i { background: var(--warn); }
.usage-bar.alert i { background: var(--danger); }
.pill { font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.ok { color: var(--good); } .pill.warn { color: var(--warn); } .pill.alert { color: var(--danger); }
.usage-verdict { border-left: 6px solid var(--good); }
.usage-verdict.warn { border-left-color: var(--warn); } .usage-verdict.alert { border-left-color: var(--danger); }
.usage-free { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.usage-free li { display: flex; flex-direction: column; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { min-height: 36px; padding: 4px 14px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: .875rem; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 650; }
.left { font-size: .8125rem; color: var(--muted); margin-top: 4px; }
.left.soon { color: var(--text); }
.left.warn { color: var(--warn); font-weight: 600; }
.leftline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.leftline .left { margin: 0; font-size: .9375rem; }
.section-title { font-size: 1.25rem; font-weight: 750; margin: 10px 4px -4px; }
.todo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.todo + .todo { border-top: .5px solid var(--line); padding-top: 12px; }
.modal { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, .45); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 32px 16px; }
.sheet { width: 100%; max-width: 46rem; background: var(--bg); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet section { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { font-size: 1rem; }
.sheethead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheethead h2 { font-size: 1.375rem; }
.sheet .kpi { background: var(--surface-2); }
details > summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
details.more { padding: 0 4px; }
details.more .row { margin-top: 8px; }
body.modal-open { overflow: hidden; }
@media (max-width: 40rem) {
  .modal { padding: 0; }
  .sheet { border-radius: 0; min-height: 100%; padding: max(14px, calc(env(safe-area-inset-top, 0px) + 10px)) 14px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .todo { flex-wrap: wrap; }
}
.row.nowrap { flex-wrap: nowrap; }
.chart.months { grid-template-columns: repeat(12, 1fr); }
@media (min-width: 40rem) { .kpis.three { grid-template-columns: repeat(3, 1fr); } }
.chart.months .v { font-size: .625rem; white-space: nowrap; }
.stage { display: flex; flex-direction: column; gap: 6px; }
.stagehead { display: flex; justify-content: space-between; gap: 12px; }
.stage .bar { height: 10px; border-radius: 5px; }
.list { display: flex; flex-direction: column; }
.listrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: .5px solid var(--line); }
.listrow:first-child { border-top: 0; padding-top: 0; }
.hint.warn, td.warn { color: var(--warn); }
.grid2 > .card { min-width: 0; }
.usage-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
</style>

<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="lumen-touch.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="lumen-cloud.js"></script>
<script src="lumen-usage.js"></script>
<script src="lumen-billing.js"></script>
<script>
(function () {
  'use strict';
  const C = window.LumenCloud;
  const AREAS = [
    ['geld', 'Geld & Finanzen'], ['recht', 'Recht & Verträge (Österreich)'], ['gesundheit', 'Körper, Gesundheit & Psyche'],
    ['haushalt', 'Haushalt, Kochen & Hacks'], ['digital', 'Digitale Sicherheit & Internet'], ['verkehr', 'Auto, Verkehr & Reisen'],
    ['tech', 'Tech & Geräte'], ['erklaert', 'Wie funktioniert das?'], ['natur', 'Natur & Wissenschaft'],
    ['geschichte', 'Geschichte & Politik'], ['kultur', 'Geografie, Kultur & Sprache'], ['denken', 'Denken, Psychologie & Kommunikation']
  ];
  const AREA_NAME = {};
  AREAS.forEach(function (a) { AREA_NAME[a[0]] = a[1]; });
  const DEFAULT_TIMES = { morgen: '07:00', mittag: '12:00', abend: '18:00' };
  const TABS = [['overview', 'Übersicht'], ['people', 'Personen'], ['money', 'Einnahmen'], ['facts', 'Fakten'], ['reports', 'Meldungen'], ['settings', 'Einstellungen'], ['system', 'System']];
  const B = window.LumenBilling;
  const S = {
    phase: 'boot', user: null, tab: 'overview', access: null, pub: null, members: {}, digests: {}, manifest: null,
    form: { email: '', password: '', error: '', busy: false }, titles: {}, weights: null, wish: null, busy: false,
    sel: null, bills: {}, billCfg: {}, group: 'all', billForm: null, cfgForm: null, sort: 'access', day: null, dayDoc: null, edit: null, runs: null, newsList: null, notice: '', times: null
  };
  const $ = function (id) { return document.getElementById(id); };
  function h(tag, attrs) {
    const el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'disabled' || k === 'checked') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (let i = 2; i < arguments.length; i += 1) add(el, arguments[i]);
    if (tag === 'button' && window.LumenTouch) el.appendChild(window.LumenTouch.label());
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  const btn = function (label, kind, onclick, disabled) { return h('button', { type: 'button', class: 'btn ' + kind, text: label, onclick: onclick, disabled: !!disabled }); };
  let toastTimer = 0;
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3500); }
  const todayVienna = function () { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); };
  function addDays(d, n) { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function fmtDay(d, long) {
    if (!d) return '–';
    const t = new Date(String(d).slice(0, 10) + 'T12:00:00Z');
    return t.toLocaleDateString('de-AT', long ? { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' } : { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  const norm = function (e) { return String(e || '').trim().toLowerCase(); };
  const nowISO = function () { return new Date().toISOString(); };
  const errText = function (e) { return (e && e.code) || 'Fehler'; };

  /* ---------- auth ---------- */

  function boot() {
    render();
    if (window.LumenTouch) window.LumenTouch.haptics();
    if (!C || !C.ready) { S.phase = 'error'; render(); return; }
    C.auth.onAuthStateChanged(async function (u) {
      S.user = u;
      if (!u) { S.phase = 'signin'; render(); return; }
      if (!u.emailVerified) { S.phase = 'verify'; render(); return; }
      if (!(await loginIsFresh(u))) { S.phase = 'locked'; render(); return; }
      load();
    });
    ['pointerdown', 'touchstart', 'keydown'].forEach(function (type) {
      document.addEventListener(type, function () { lastActive = Date.now(); }, { capture: true, passive: true });
    });
    setInterval(function () {
      if (S.phase === 'ready' && C.firebase && Date.now() - lastActive > IDLE_MINUTES * 60000) { S.phase = 'locked'; S.form.password = ''; render(); }
    }, 30000);
  }
  /* The admin area asks for the password again after a pause and at least every 12 hours. The database rules enforce the 12 hours too. */
  const FRESH_HOURS = 12, IDLE_MINUTES = 20;
  let lastActive = Date.now();
  async function loginIsFresh(u) {
    try {
      if (!u.getIdTokenResult) return true;
      const t = await u.getIdTokenResult();
      return Date.now() - Date.parse(t.authTime) < FRESH_HOURS * 3600000;
    } catch (e) { return true; }
  }
  async function unlock() {
    const F = S.form;
    F.busy = true; F.error = ''; render();
    try {
      const cred = C.firebase.auth.EmailAuthProvider.credential(S.user.email, F.password);
      await S.user.reauthenticateWithCredential(cred);
      await S.user.getIdToken(true);
      F.password = ''; F.busy = false; lastActive = Date.now();
      await load();
      return;
    } catch (e) { F.error = C.message(e); }
    F.busy = false; render();
  }
  function lockCard() {
    const F = S.form;
    return h('div', { class: 'card', style: 'max-width:26rem' }, h('h2', { text: 'Passwort bestätigen' }),
      h('p', { class: 'muted', text: 'Zum Schutz fragt der Admin-Bereich nach 20 Minuten Pause und spätestens alle 12 Stunden wieder nach deinem Passwort.' }),
      h('label', { class: 'field' }, h('span', { text: 'Passwort' }), h('input', { type: 'password', value: F.password, autocomplete: 'current-password',
        oninput: function (e) { F.password = e.target.value; }, onkeydown: function (e) { if (e.key === 'Enter') unlock(); } })),
      F.error ? h('p', { class: 'error', role: 'alert', text: F.error }) : null,
      btn(F.busy ? 'Einen Moment …' : 'Entsperren', 'primary', unlock, F.busy));
  }
  async function signIn() {
    const F = S.form;
    F.busy = true; F.error = ''; render();
    try { await C.auth.signInWithEmailAndPassword(F.email.trim(), F.password); F.password = ''; }
    catch (e) { F.error = C.message(e); }
    F.busy = false; render();
  }
  function signOut() { C.auth.signOut().then(function () { location.reload(); }); }

  /* ---------- data ---------- */

  async function load() {
    S.phase = 'loading'; render();
    try {
      const acc = await C.db.doc('config/access').get();
      S.access = Object.assign({ adminEmails: [], invited: [] }, acc.exists ? acc.data() : {});
    } catch (e) {
      S.phase = e && e.code === 'permission-denied' ? 'denied' : 'error';
      render();
      return;
    }
    // New error reports go on to the weekly task without a click.
    try { await C.forwardReports(); } catch (e) { /* tried again on the next visit */ }
    try {
      const got = await Promise.all([
        C.db.doc('config/public').get(), C.db.collection('members').get(), C.db.collection('digest').get(),

      h('div', { class: 'card usage-verdict ' + a.verdict.level }, h('h2', { text: a.verdict.title }), h('p', { text: a.verdict.text }),
        a.verdict.note ? h('p', { class: 'hint', text: a.verdict.note }) : null,
        when ? h('p', { class: 'hint', text: 'Gemessen am ' + when + '. ' + a.resetNote }) : null),
      a.lacksAccess ? usageHelp(a.accessError) : null,
      h('div', { class: 'card' }, h('h2', { text: 'Grenzen im kostenlosen Tarif' }), a.items.map(function (i) {
        const hasPct = typeof i.pct === 'number';
        return h('div', { class: 'usage-row' },
          h('div', { class: 'usage-head' }, h('strong', { text: i.name }), h('span', { class: 'pill ' + i.level, text: word[i.level] })),
          hasPct ? h('div', { class: 'bar usage-bar ' + i.level }, h('i', { style: 'width:' + Math.min(100, Math.max(1, i.pct)) + '%' })) : null,
          h('p', { class: 'hint', text: i.text + (hasPct ? ' · ' + i.pct.toLocaleString('de-AT') + ' %' : '') }),
          i.forecast ? h('p', { class: 'hint', text: i.forecast }) : null);
      })),
      h('div', { class: 'card' }, h('h2', { text: 'Kostenlos, hier wird es nicht eng' }),
        h('ul', { class: 'usage-free' }, a.free.map(function (f) { return h('li', {}, h('strong', { text: f.name }), h('span', { class: 'hint', text: f.text })); })))
    ];
  }
  function reports() {
    const list = allReports(), open = list.filter(function (r) { return !handled(r); });
    const toSend = open.filter(function (r) { return !forwarded(r); });
    return [h('div', { class: 'card' }, h('h2', { text: 'Fehlermeldungen' }),
      h('p', { class: 'hint', text: 'Neue Meldungen gehen automatisch an die Wochenaufgabe, sobald du Lumen oder diese Seite öffnest. Sie prüft am Sonntag mit Quellen und bekommt nur Fakt und Hinweis, keine Namen. Einen Fakt kannst du auch sofort selbst korrigieren oder ausblenden (über „Fakt öffnen“).' }),
      h('div', { class: 'row' }, btn(toSend.length ? toSend.length + ' offene Meldung' + (toSend.length === 1 ? '' : 'en') + ' weitergeben' : 'Alles weitergegeben', 'primary', function () {
        const keep = (S.pub.reports || []).filter(function (x) { return !handled(x); });
        const next = keep.concat(toSend.map(function (r) { return { factId: r.factId, note: String(r.note || '').slice(0, 200), reportedAt: r.reportedAt }; })).slice(-60);
        savePublic({ reports: next }, 'Weitergegeben. Die Wochenaufgabe prüft sie am Sonntag.');
      }, S.busy || !toSend.length)),
      list.length ? h('div', { class: 'tablewrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Gemeldet' }), h('th', { text: 'Fakt' }), h('th', { text: 'Hinweis' }), h('th', { text: 'Von' }), h('th', { text: 'Stand' }), h('th'))),
        h('tbody', {}, list.map(function (r) {
          const who = S.members[r.uid] || {};
          return h('tr', {}, h('td', { text: fmtDay(r.reportedAt) }), h('td', { text: S.titles[r.factId] || r.factId }), h('td', { text: r.note || '–' }),
            h('td', { text: who.name || who.email || '–' }),
            h('td', {}, h('span', { class: 'tag' + (handled(r) ? '' : ' warn'), text: handled(r) ? 'bearbeitet' : (forwarded(r) ? 'weitergegeben' : 'neu') })),
            h('td', {}, h('div', { class: 'row nowrap' }, btn('Fakt öffnen', 'secondary small', function () { S.tab = 'facts'; openDay(String(r.factId).slice(0, 10)); }),
              btn('Entfernen', 'secondary small', function () {
                if (!window.confirm('Diese Meldung entfernen? Sie verschwindet aus der Liste und geht nicht an die Wochenaufgabe.')) return;
                removeReport(r);
              }, S.busy))));
        })))) : h('p', { class: 'muted', text: 'Keine Meldungen.' }))];
  }

  /* ---------- weekly task ---------- */

  function nextSunday() {
    const t = todayVienna(), wd = new Date(t + 'T12:00:00Z').getUTCDay();
    return addDays(t, (7 - wd) % 7);
  }
  function weekly() {
    const m = S.manifest;
    if (!S.runs) {
      S.runs = [];
      Promise.all((m.runs || []).slice(-8).reverse().map(function (id) {
        return fetch('data/runs/' + id + '.json?v=' + encodeURIComponent(m.updatedAt || '')).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      })).then(function (list) { S.runs = list.filter(Boolean); render(); });
      C.content.news(6).then(function (list) { S.newsList = list; render(); }).catch(function () {});
    }
    return [
      h('div', { class: 'card' }, h('h2', { text: 'Wochenaufgabe' }),
        h('p', {}, 'Läuft jeden Sonntag um 11:07 Uhr (Sommerzeit 12:07 Uhr). Nächster Lauf: ', h('b', { text: fmtDay(nextSunday(), true) }), '.'),
        h('p', { class: 'hint', text: 'Sie füllt den Vorrat auf mindestens vier Wochen auf, prüft weitergegebene Fehlermeldungen, schreibt „Aktuell“ und übernimmt deine Korrekturen. Was sie liest: deine Themen-Gewichte, den Themenwunsch und die weitergegebenen Meldungen.' }),
        h('div', { class: 'kpis' }, kpi(m.lastDate ? fmtDay(m.lastDate) : '–', 'Vorrat reicht bis'), kpi((m.days || []).length * 5, 'Fakten im Archiv'), kpi((m.news || []).length, 'Ausgaben „Aktuell“'))),
      h('div', { class: 'card' }, h('h2', { text: 'Letzte Läufe' }),
        S.runs && S.runs.length ? h('div', { class: 'tablewrap' }, h('table', {},
          h('thead', {}, h('tr', {}, h('th', { text: 'Lauf' }), h('th', { class: 'num', text: 'neu' }), h('th', { text: 'Vorrat bis' }), h('th', { text: 'Aktuell' }), h('th', { text: 'Notiz' }))),
          h('tbody', {}, S.runs.map(function (r) {
            return h('tr', {}, h('td', { text: fmtDay(r.at || r.date) }), h('td', { class: 'num', text: String(r.added || 0) }), h('td', { text: fmtDay(r.lastDate) }),
              h('td', { text: r.newsDate ? 'ja' : 'nein' }), h('td', { class: 'hint', text: r.notes || '' }));
          })))) : h('p', { class: 'muted', text: 'Lädt …' })),
      h('div', { class: 'card' }, h('h2', { text: 'Ausgaben „Aktuell“' }),
        S.newsList && S.newsList.length ? S.newsList.map(function (n) {
          return h('div', { class: 'news' }, h('p', {}, h('b', { text: fmtDay(n.date, true) })), h('ul', {}, (n.items || []).map(function (it) {
            return h('li', {}, it.title + ' ', it.source && it.source.url ? h('a', { href: it.source.url, target: '_blank', rel: 'noopener noreferrer', text: '(' + (it.source.name || 'Quelle') + ')' }) : null);
          })));
        }) : h('p', { class: 'muted', text: 'Noch keine Ausgabe.' }))
    ];
  }

  /* Deep links from the dashboard connector and the reminders: admin.html#people/<uid>, #reports …
     Older names still work: #billing/<uid> opens the person, #usage and #weekly open "System". */
  function fromHash() {
    const m = /^#([a-z]+)(?:\/(.+))?$/.exec(location.hash || '');
    if (!m) return false;
    const tab = ({ billing: 'people', usage: 'system', weekly: 'system' })[m[1]] || m[1];
    if (!TABS.some(function (t) { return t[0] === tab; })) return false;
    S.tab = tab;
    S.sel = tab === 'people' && m[2] ? decodeURIComponent(m[2]) : null;
    S.billForm = null;
    return true;
  }
  function setHash() { try { history.replaceState(null, '', '#' + S.tab + (S.tab === 'people' && S.sel ? '/' + S.sel : '')); } catch (e) { /* ignore */ } }
  fromHash();
  window.addEventListener('hashchange', function () { if (fromHash()) render(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sel && S.tab === 'people') { S.sel = null; S.billForm = null; setHash(); render(); } });
  boot();
})();
</script>
</body>
