<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="Jeden Tag ein paar Fakten, Quiz und Auffrischung.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try { var lt = localStorage.getItem('lumen-theme'); if (lt) document.documentElement.setAttribute('data-theme', lt); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: one column for the thumb. Each screen shows one card with one main action; tabs sit at the bottom. */
:root {
  --bg: #f2f2f7; --surface: #ffffff; --surface-2: #e9e9ee; --seg-on: #ffffff; --text: #000000; --muted: #6c6c70; --line: rgba(60, 60, 67, .18);
  --accent: #000000; --on-accent: #ffffff; --accent-soft: #e9e9ee; --on-accent-soft: #000000; --brand: #c75300;
  --star: #b25000; --good: #248a3d; --good-soft: #e2f5e7; --warn: #b25000; --warn-soft: #fff1dd; --danger: #d70015;
  --glass: rgba(255, 255, 255, .72); --glass-line: rgba(0, 0, 0, .08); --scrim: rgba(0, 0, 0, .35);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: var(--font-ui);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --seg-on: #636366; --text: #ffffff; --muted: #98989f; --line: rgba(84, 84, 88, .55);
    --accent: #ffffff; --on-accent: #000000; --accent-soft: #2c2c2e; --on-accent-soft: #ffffff; --brand: #ff9f0a;
    --star: #ffd60a; --good: #30d158; --good-soft: #12301c; --warn: #ffb340; --warn-soft: #33260f; --danger: #ff6961;
    --glass: rgba(44, 44, 46, .68); --glass-line: rgba(255, 255, 255, .12); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --seg-on: #636366; --text: #ffffff; --muted: #98989f; --line: rgba(84, 84, 88, .55);
    --accent: #ffffff; --on-accent: #000000; --accent-soft: #2c2c2e; --on-accent-soft: #ffffff; --brand: #ff9f0a;
    --star: #ffd60a; --good: #30d158; --good-soft: #12301c; --warn: #ffb340; --warn-soft: #33260f; --danger: #ff6961;
    --glass: rgba(44, 44, 46, .68); --glass-line: rgba(255, 255, 255, .12); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}

/* Black: pure black with slightly darker cards and heavier text. */
:root[data-theme="black"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --seg-on: #636366; --text: #ffffff; --muted: #98989f; --line: rgba(84, 84, 88, .55);
    --accent: #ffffff; --on-accent: #000000; --accent-soft: #2c2c2e; --on-accent-soft: #ffffff; --brand: #ff9f0a;
    --star: #ffd60a; --good: #30d158; --good-soft: #12301c; --warn: #ffb340; --warn-soft: #33260f; --danger: #ff6961;
    --glass: rgba(44, 44, 46, .68); --glass-line: rgba(255, 255, 255, .12); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
    --surface: #121214; --surface-2: #242426;
}
:root[data-theme="black"] body { font-weight: 500; -webkit-font-smoothing: antialiased; }
:root[data-theme="black"] .text { font-weight: 500; }

html { height: 100%; box-sizing: border-box; font-size: 106.25%; -webkit-text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
*, *::before, *::after { box-sizing: inherit; }
details > * { box-sizing: border-box; }
body {
  height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); overscroll-behavior: none;
  font-family: var(--font-ui); font-size: 1rem; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px;
  /* iOS blurs a strip below the status bar in home-screen apps; keep the header clear of it. */
  padding-top: max(6px, calc(env(safe-area-inset-top, 0px) + 22px)); padding-bottom: 2px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-family: var(--font-read); font-size: 1.75rem; font-weight: 600; line-height: 1.15; }
.status { color: var(--muted); font-size: .8125rem; min-width: 0; line-height: 1.3; }
.top .iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 44px; height: 44px; }
.iconbtn {
  width: 48px; height: 48px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 14px; background: transparent; color: var(--text);
}
.iconbtn:active { background: var(--surface-2); }
.iconbtn.on { color: var(--star); }
.iconbtn.on svg { fill: currentColor; }
.main {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 4px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.main:focus { outline: none; }
.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 10px));
}
.tabs button {
  min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; background: transparent; color: var(--muted); font-size: .75rem;
}
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }

.view { display: flex; flex-direction: column; }
.viewtitle { font-family: var(--font-read); font-size: 1.5rem; line-height: 1.2; font-weight: 600; margin: 8px 0 18px; text-wrap: balance; }
.label { color: var(--muted); font-size: .8125rem; letter-spacing: .01em; margin: 0 2px 8px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.cardhead .iconbtn { margin: -10px -12px -10px 0; }
.chip {
  display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--on-accent-soft); font-size: .8125rem; font-weight: 600;
}
.chip.plain { background: var(--surface-2); color: var(--muted); }
/* Each area has its own hue (--hue) and line icon. */
.chip.area { gap: 6px; background: hsl(var(--hue) 45% 91%); color: hsl(var(--hue) 45% 25%); }
.chip.area svg { width: 15px; height: 15px; stroke-width: 2; }
.adot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: hsl(var(--hue) 55% 48%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip.area { background: hsl(var(--hue) 26% 17%); color: hsl(var(--hue) 55% 78%); }
  :root:not([data-theme="light"]) .adot { background: hsl(var(--hue) 55% 62%); }
}
:root[data-theme="dark"] .chip.area { background: hsl(var(--hue) 26% 17%); color: hsl(var(--hue) 55% 78%); }
:root[data-theme="dark"] .adot { background: hsl(var(--hue) 55% 62%); }
:root[data-theme="black"] .chip.area { background: #171717; color: #ffffff; }
:root[data-theme="black"] .chip.area svg { color: hsl(var(--hue) 70% 70%); }
:root[data-theme="black"] .adot { background: hsl(var(--hue) 70% 66%); }
.chips button .adot { margin-right: 6px; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.friends { display: flex; flex-direction: column; }
.friend { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.friend > div { flex: 1; min-width: 0; }
.friend strong { display: block; font-weight: 600; }
.friend small { color: var(--muted); font-size: .8125rem; }
.friend .rank { width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.friend > b { font-size: 1.125rem; font-variant-numeric: tabular-nums; }
.friend.me strong { color: var(--accent); }
.weekline { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.weekline span { color: var(--muted); font-size: .875rem; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
.tile b { display: block; font-size: 1.375rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { color: var(--muted); font-size: .75rem; }
.calhead, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.calhead span { text-align: center; color: var(--muted); font-size: .6875rem; }
.cal { margin-top: 4px; }
.cal i { display: block; aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); }
.cal i.on { background: var(--accent); }
.cal i.now { outline: 2px solid var(--text); outline-offset: 1px; }
.cal i.later { opacity: .35; }
.scorebar { display: flex; gap: 4px; }
.scorebar i { flex: 1; height: 6px; border-radius: 3px; background: var(--good); }
.scorebar i.no { background: var(--warn); }
.missed { display: flex; flex-direction: column; gap: 4px; }
.option.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.arearow .line strong { display: inline-flex; align-items: center; gap: 8px; }
.title { font-family: var(--font-read); font-size: 1.35rem; line-height: 1.25; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.text { font-size: 1.0625rem; line-height: 1.55; overflow-wrap: anywhere; }
.lead { color: var(--muted); }
.mnemonic { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .9375rem; }
.mnemonic b { display: block; color: var(--muted); font-size: .75rem; font-weight: 600; letter-spacing: .02em; }
.note { color: var(--muted); font-size: .8125rem; }
.statusnote { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: .875rem; }
.glyph { color: var(--star); width: 40px; height: 40px; }

.btn {
  min-height: 50px; padding: 8px 18px; border-radius: 13px; border: 1px solid transparent; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--text); }
.btn.quiet { background: transparent; color: var(--accent); padding-inline: 10px; }
.btn.link { min-height: 44px; padding: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: .875rem; text-decoration: underline; text-underline-offset: 3px; }
.btn:active { opacity: .82; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 8rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  width: 100%; min-height: 54px; padding: 12px 14px; text-align: left; border: 1px solid var(--line); border-radius: 13px;
  background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow-wrap: anywhere;
}
.option:active { background: var(--surface-2); }
.option[disabled] { cursor: default; opacity: 1; }
.option.correct { background: var(--good-soft); border-color: var(--good); }
.option.chosen { background: var(--warn-soft); border-color: var(--warn); }
.option small { flex: none; font-weight: 650; font-size: .75rem; }
.option.correct small { color: var(--good); }
.option.chosen small { color: var(--warn); }
.feedbackslot:empty { display: none; }
.feedback b { display: block; font-size: 1.0625rem; }
.feedback.right b { color: var(--good); }
.feedback.almost b { color: var(--warn); }
.big { font-family: var(--font-read); font-size: 2rem; line-height: 1.15; font-weight: 600; }

.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.pill {
  min-height: 60px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 13px; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: .8125rem; min-width: 0;
}
.pill b { font-size: .875rem; }
.pill span { color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.done span { color: var(--good); }
.pill[aria-current="true"] { border-color: var(--accent); background: var(--surface); }
.pill[disabled] { cursor: default; }
.under { display: flex; flex-direction: column; margin-top: 6px; }
.lineitem {
  width: 100%; min-height: 50px; padding: 10px 2px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; font-size: .9375rem;
}
.lineitem b { color: var(--accent); font-weight: 650; }
.under .lineitem:first-child { margin-top: 12px; }

.search input, .field input, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); font-size: max(1rem, 16px);
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .fieldlabel { font-size: .875rem; font-weight: 600; }
.hint { color: var(--muted); font-size: .8125rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: .875rem;
}
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--on-accent-soft); font-weight: 650; }
.dayhead { color: var(--muted); font-size: .8125rem; margin: 18px 2px 2px; }
.item {
  width: 100%; min-height: 58px; padding: 10px 2px; display: flex; align-items: center; gap: 12px; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: transparent;
}
.item > div { flex: 1; min-width: 0; }
.item strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item small { color: var(--muted); font-size: .8125rem; }
.item svg { color: var(--muted); width: 20px; height: 20px; }
.item .mark { color: var(--star); fill: currentColor; }
.empty { color: var(--muted); padding: 24px 2px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; max-width: 34rem; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--bg); border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px); touch-action: pan-y;
  transition: transform .22s ease-out;
}
.sheethead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet.dragging { transition: none; }
.sheethead h2 { font-size: 1.0625rem; font-weight: 650; overflow-wrap: anywhere; }
.sheetbody {
  overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-block: 6px 28px; display: flex; flex-direction: column; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 13px; }
.seg button { min-height: 44px; padding: 4px 6px; border: 0; border-radius: 10px; background: transparent; font-size: .875rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section h3 { font-size: .9375rem; font-weight: 650; }
.arearow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.arearow .line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.arearow .line span { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; text-align: right; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.times { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.times .field { min-width: 0; }
.field input[type="time"] { min-width: 0; -webkit-appearance: none; appearance: none; text-align: left; padding-inline: 10px; }
.planhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.planrow { display: grid; grid-template-columns: minmax(0, 1fr) 106px 112px; align-items: center; gap: 8px; min-height: 48px; }
.planrow input[type="time"] {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: max(1rem, 16px); -webkit-appearance: none; appearance: none; text-align: left;
}
.planrow.off input[type="time"], .planrow.off label { opacity: .45; }
.planrow .wide { grid-column: 1 / 3; }
.stepper { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; background: var(--surface-2); border-radius: 12px; }
.stepper button { height: 44px; padding: 0; border: 0; background: transparent; font-size: 1.25rem; }
.stepper button[disabled] { opacity: .3; cursor: default; }
.stepper output { text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }
@media (max-width: 350px) { .planrow { grid-template-columns: minmax(0, 1fr) 92px 100px; gap: 6px; } .planrow input[type="time"] { padding-inline: 6px; } .stepper { grid-template-columns: 32px 1fr 32px; } }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switchrow input[type="checkbox"] {
  -webkit-appearance: none; appearance: none; flex: none; margin: 0; width: 51px; height: 31px; border-radius: 16px; cursor: pointer;
  border: 1px solid var(--line); background-color: var(--line);
  background-image: radial-gradient(circle at 15px 50%, #ffffff 0 12px, transparent 12.5px);
}
.switchrow input[type="checkbox"]:checked {
  border-color: var(--accent); background-color: var(--accent);
  background-image: radial-gradient(circle at calc(100% - 15px) 50%, var(--on-accent) 0 12px, transparent 12.5px);
}
.switchrow input[type="checkbox"]:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: no-preference) { .switchrow input[type="checkbox"] { transition: background-color .2s, border-color .2s; } }
.newsitem { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.newsitem h3 { font-family: var(--font-read); font-size: 1.125rem; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.newsitem .meta { color: var(--muted); font-size: .8125rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.newsitem a, .answer a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.answer { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.msg { border-radius: 14px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { background: var(--accent-soft); color: var(--on-accent-soft); align-self: flex-end; max-width: 90%; }
.msg.claude { background: var(--surface); border: 1px solid var(--line); }
.chat { display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); padding: 10px 16px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: .9375rem; text-align: center;
}

  /* ---------- private data: optimistic, one write at a time per document ---------- */

  function overlay() {
    const out = Object.assign({}, S.server);

      const q = S.queues[k];

  async function pump(docId) {

      await ref.set(q.inflight, { merge: true });

  /* ---------- digest: summary of the learning state for the admin page ---------- */

  let digestTimer = 0, digestBusy = false, digestAgain = false;

    next.name = (S.authUser && S.authUser.displayName) || '';

  /* ---------- loading ---------- */

  function boot() {

  /* ---------- facts ---------- */

  function dayDoc(date) {

    }));

  }

  }
  /* Whoever reads more per day than a calendar day holds continues with the next days of the store. */
  let aheadBusy = false;

    aheadBusy = true;
    let got = false;
    try {
      const m = await C.content.manifest();
      const days = (m.days || []).filter(function (d) { return d > t && S.win[d] === undefined; }).sort();
      for (let i = 0; i < days.length && plannedFacts().length < planCfg().total; i += 1) {
        const doc = await C.content.day(days[i]);

        S.win[days[i]] = doc;

  /* A fact read ahead can still be rewritten by the weekly task. Then the person has not read the new one. */

  /* ---------- rendering ---------- */

  let raf = 0;

  function render() {

      if (S.tab === 'today') {
        const st = L.streak(S.ls.days, today());
        line = L.formatDay(today(), { long: true }) + (st > 1 ? ' · ' + st + ' Tage in Folge' : '');
      } else if (S.tab === 'practice') {
        const due = refreshIds().length;
        line = L.learnedCount(S.ls.states) + ' Fakten gelernt' + (due ? ' · ' + due + ' fällig' : '');
      } else if (S.tab === 'archive') line = 'Alles, was du schon gelesen hast';
      else if (!S.youPage) {
        const learned = L.learnedCount(S.ls.states);
        line = (firstName() ? firstName() + ' · ' : '') + learned + (learned === 1 ? ' Fakt gelernt' : ' Fakten gelernt');
      }
      if (S.stale) line += ' · offline';
    }
    if (S.phase === 'ready') forgetReplaced();
    const sub = S.tab === 'you' && S.youPage && S.phase === 'ready';
    setTitle(sub ? YOU_PAGES[S.youPage] : (titles[S.tab] || 'Lumen'));
    $('btnBack').hidden = !sub;

    const outside = S.phase === 'signin' || S.phase === 'verify' || S.phase === 'denied';

    headerButton(sub);
    if (outside) S.tab = 'today';
    const before = VIEWS.filter(function (p) { return !$(p[1]).hidden; })[0];
    VIEWS.forEach(function (pair, i) {
      const el = $(pair[1]), show = S.tab === pair[0];
      if (show && el.hidden && before && S.phase === 'ready') slideIn(el, i > VIEWS.indexOf(before) ? 'in-r' : 'in-l');

    else if (S.tab === 'archive') renderArchive();

    maybeAskPush();
  }
  const VIEWS = [['today', 'viewToday'], ['practice', 'viewPractice'], ['archive', 'viewArchive'], ['you', 'viewYou']];
  const motion = function () { return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); };
  /* Restart a short CSS animation on an element that stays in place. */

    const q = A.query.trim(), ids = archiveIds(), hits = {};
    A.hits.forEach(function (id) { hits[id] = true; });

    if (q) {
      A.hits.forEach(function (id) { if (wanted.indexOf(id) === -1 && ids.indexOf(id) !== -1 && factById(id)) facts.push(factById(id)); });

    }

    let lastDay = '';
    facts.slice(0, A.cap).forEach(function (f) {

        h('span', { html: ICON.next })));
    });
    if (!facts.length && !A.loading && !A.failed) list.appendChild(h('p', { class: 'empty', text: q || A.filter !== 'all' ? 'Nichts gefunden.' : 'Hier sammelt sich alles, was du gelesen hast.' }));

    const level = S.sheets.length;

    sheet.scrim = h('div', { class: 'scrim', style: 'z-index:' + (40 + level * 2), onclick: close });
    sheet.panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId, style: 'z-index:' + (41 + level * 2) },
      h('div', { class: 'grab', 'aria-hidden': 'true' }),
      h('div', { class: 'sheethead' }, h('h2', { id: titleId, text: title }),
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Schließen', html: ICON.close, onclick: close })), body);
    sheet.draw = function () { const y = body.scrollTop, next = document.createElement('div'); append(next, build(sheet)); morphChildren(body, next, true); body.scrollTop = y; };
    $('sheets').appendChild(sheet.scrim);
    $('sheets').appendChild(sheet.panel);
    S.sheets.push(sheet);
    sheet.draw();
    sheet.panel.querySelector('.iconbtn').focus();
    dragToClose(sheet);
    return sheet;
  }
  /* Swipe a sheet down to close it: from the handle or header, or from the content when it is scrolled to the top. */
  function dragToClose(sheet) {
    const panel = sheet.panel;
    let y0 = null, x0 = 0, dy = 0, t0 = 0, active = false;
    panel.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      const inBody = sheet.body.contains(e.target);
      if (inBody && (sheet.body.scrollTop > 0 || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); active = false;
    }, { passive: true });
    panel.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      const ty = e.touches[0].clientY - y0, tx = e.touches[0].clientX - x0;
      if (!active) {
        if (Math.abs(tx) > Math.abs(ty) || ty < 6) { if (ty < -6 || Math.abs(tx) > 10) y0 = null; return; }
        active = true;
        panel.classList.add('dragging');
      }
      dy = Math.max(0, ty);
      panel.style.transform = 'translateY(' + dy + 'px)';
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    const end = function () {
      if (y0 === null) return;
      y0 = null;
      if (!active) return;
      panel.classList.remove('dragging');
      const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
      if (dy > Math.min(140, panel.offsetHeight * 0.3) || fast) {
        panel.style.transform = 'translateY(100%)';
        tick('single');
        setTimeout(function () { closeSheet(sheet); }, 180);
      } else panel.style.transform = '';
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  }
  function closeSheet(sheet) {
    const i = S.sheets.indexOf(sheet);
    if (i === -1) return;
    S.sheets.splice(i, 1);
    const scrim = sheet.scrim, panel = sheet.panel;
    if (motion()) {
      panel.classList.add('leaving');
      scrim.classList.add('leaving');
      setTimeout(function () { scrim.remove(); panel.remove(); }, 200);
    } else { scrim.remove(); panel.remove(); }
    if (sheet.onclose) sheet.onclose();
    try { if (sheet.opener && document.contains(sheet.opener)) sheet.opener.focus(); } catch (e) { /* ignore */ }
  }

  async function enablePush(redraw) {
    if (pushBusy) return;
    pushBusy = true; redraw();
    try {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) throw new Error('unsupported');
      /* Ask right away, before anything is loaded: iOS only shows the question during the tap itself. */
      const asked = Notification.permission === 'granted' ? Promise.resolve('granted') : Notification.requestPermission();
      if (!C.messaging) {
        await new Promise(function (resolve, reject) {
          const sc = document.createElement('script');
          sc.src = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js';
          sc.onload = resolve; sc.onerror = reject;
          document.head.appendChild(sc);
        });
        try {
          const ok = !C.firebase.messaging.isSupported || await C.firebase.messaging.isSupported();
          C.messaging = ok ? C.firebase.app().messaging() : null;
        } catch (e) { C.messaging = null; }
        if (!C.messaging) throw new Error('unsupported');
      }
      const perm = await asked;
      if (perm !== 'granted') { toast('Ohne deine Erlaubnis kann Lumen nicht erinnern. Du kannst sie in den iPhone-Einstellungen bei Lumen erteilen.'); pushBusy = false; redraw(); return; }
      const reg = await navigator.serviceWorker.ready;
      const token = await C.messaging.getToken({ vapidKey: self.LUMEN_VAPID, serviceWorkerRegistration: reg });
      await S.db.doc('push/' + S.uid).set({ token: token, enabled: true, times: times(), counts: planCfg().counts, updatedAt: nowISO() }, { merge: true });
      writePriv('settings', { push: true });
      toast('Erinnerungen sind an.');
    } catch (e) {

    }
    pushBusy = false; redraw();
  }

    try { await S.db.doc('push/' + S.uid).delete(); } catch (e) { /* ignore */ }

  /* ---------- Freunde (opt-in) and deleting the account ---------- */

  function weekStats() {
    const t = today(), states = S.ls.states;
    const monday = L.addDays(t, -((new Date(t + 'T12:00:00Z').getUTCDay() + 6) % 7));
    const week = Object.keys(states).filter(function (id) { const d = L.dateOfISO(states[id].seenAt); return d && d >= monday && !states[id].known; }).length;
    const sure = Object.keys(states).filter(function (id) { return !states[id].known && (states[id].box || 0) >= 3; }).length;
    return { monday: monday, week: week, sure: sure, learned: L.learnedCount(states), streak: L.streak(S.ls.days, t) };
  }
  let friendTimer = 0;
  function publishFriend() {
    // Only people who switched friends mode on appear for the others; a small summary, no single facts.
    if (settings().friends !== true || !S.db || !S.uid) return;
    clearTimeout(friendTimer);
    friendTimer = setTimeout(function () {
      const w = weekStats();
      S.db.doc('friends/' + S.uid).set({
        name: firstName(),
        streak: w.streak, week: w.week, weekOf: w.monday, learned: w.learned, sure: w.sure, updatedAt: nowISO()
      }).catch(function () {});
    }, 1500);
  }
  function setFriends(on, redraw) {
    writePriv('settings', { friends: on });
    if (on) { publishFriend(); loadFriends(redraw); }
    else { S.friends = null; S.db.doc('friends/' + S.uid).delete().catch(function () {}); if (redraw) redraw(); }
  }
  let friendsLoading = false;
  function loadFriends(redraw) {
    if (friendsLoading) return;
    friendsLoading = true;
    S.db.collection('friends').get().then(function (snap) {
      S.friends = snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); });
    }).catch(function () { S.friends = []; }).then(function () { friendsLoading = false; if (redraw) redraw(); });
  }
  const firstName = function () { return String((S.authUser && S.authUser.displayName) || '').trim().slice(0, 40); };
  function nameField(redraw) {
    return h('label', { class: 'field' }, h('span', { text: 'Vorname' }),
      h('input', { id: 'nameInput', type: 'text', maxlength: '40', autocomplete: 'given-name', enterkeyhint: 'done', value: firstName(),
        onchange: function (e) { saveName(e.target.value, redraw); } }));
  }
  function saveName(value, redraw) {
    const name = String(value || '').trim().slice(0, 40), u = C.auth.currentUser;
    if (!u || name === firstName()) return;
    u.updateProfile({ displayName: name }).then(function () {
      S.db.doc('members/' + S.uid).set({ name: name }, { merge: true }).catch(function () {});
      publishFriend();

  function friendsView(redraw) {
    if (settings().friends !== true) {
      return h('div', { class: 'section' },
        h('p', { class: 'lead', text: 'Im Freundesmodus siehst du, wie die anderen dabei sind, und sie sehen dich.' }),
        h('p', { class: 'hint', text: 'Sichtbar sind nur dein Vorname, deine Serie und wie viele Fakten du diese Woche und insgesamt gelernt hast. Keine Antworten, keine einzelnen Fakten. Du kannst ihn jederzeit wieder ausschalten.' }),
        btn('Freundesmodus einschalten', 'primary', function () { setFriends(true, redraw); }));
    }
    if (!S.friends) { loadFriends(redraw); return h('p', { class: 'hint', text: 'Lädt …' }); }
    const w = weekStats();
    const list = S.friends.filter(function (f) { return f.uid === S.uid || f.weekOf === w.monday || f.learned; })
      .map(function (f) { return f.uid === S.uid ? Object.assign({}, f, { week: w.week, learned: w.learned, streak: w.streak }) : Object.assign({}, f, { week: f.weekOf === w.monday ? f.week : 0 }); })
      .sort(function (a, b) { return (b.week - a.week) || (b.learned - a.learned); });

      };
      if (!motion()) { finish(); return; }
      const ms = Math.round(Math.max(110, Math.min(200, (s.width - Math.abs(s.dx)) / Math.max(0.8, Math.abs(v)))));
      el.style.transition = 'transform ' + ms + 'ms ease-out, opacity ' + ms + 'ms ease-out';
      el.style.transform = 'translateX(' + (Math.sign(s.dx) * s.width * 0.45) + 'px)';
      el.style.opacity = '0';
      setTimeout(finish, ms);
    };
    $('main').addEventListener('touchend', end, { passive: true });
    $('main').addEventListener('touchcancel', end, { passive: true });
  })();
  let searchTimer = 0;
  $('archiveSearch').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(function () {
      S.archive.query = value;
      S.archive.cap = 120;
      S.archive.hits = [];
      render();
      if (value.trim().length >= 3 && S.phase === 'ready') searchTopics();
    }, 250);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheets.length) closeSheet(S.sheets[S.sheets.length - 1]);
    else if (e.key === 'Escape' && S.tab === 'you' && S.youPage) openYou(null);
  });
  function clock() {
    S.now = new Date();
    const p = parts();
    if (S.phase === 'ready' && S.winDay && p.date !== S.winDay) {
      if (S.flow && S.flow.type === 'read') S.flow = null;
      S.later = {};
      S.pick = null;
      S.seen.win = false; S.fresh.win = false;
      subWindow();
      loadSide();
    }
    const sig = p.date + L.BLOCKS.map(function (b) { return L.blockUnlocked(b, times(), p.minutes, dayRec().unlocked) ? '1' : '0'; }).join('');
    if (sig !== S.sig) { S.sig = sig; scheduleRender(); }
  }
  setInterval(clock, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) clock(); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  if (window.LumenTouch) window.LumenTouch.equip(document);
  boot();
})();
</script>
