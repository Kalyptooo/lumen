<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="Fünf Fakten am Tag, Quiz und Auffrischung.">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: one column for the thumb. Each screen shows one card with one main action; tabs sit at the bottom. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --surface-2: #e6ecea; --text: #17211d; --muted: #52605a; --line: #d2dad6;
  --accent: #0f6b5f; --on-accent: #ffffff; --accent-soft: #dcefe9; --on-accent-soft: #0b4a42;
  --star: #8f6200; --good: #1a6b41; --good-soft: #dff2e6; --warn: #7d5200; --warn-soft: #faefd6; --danger: #a8281f;
  --scrim: rgba(12, 20, 17, .45);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #181f1c; --surface-2: #232c28; --text: #e7edea; --muted: #a2afa9; --line: #2f3a35;
    --accent: #72cdb9; --on-accent: #06211c; --accent-soft: #1c322d; --on-accent-soft: #a8e2d5;
    --star: #e3b256; --good: #7fd4a0; --good-soft: #16301f; --warn: #e6bd6b; --warn-soft: #33280e; --danger: #f1a39d;
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #181f1c; --surface-2: #232c28; --text: #e7edea; --muted: #a2afa9; --line: #2f3a35;
  --accent: #72cdb9; --on-accent: #06211c; --accent-soft: #1c322d; --on-accent-soft: #a8e2d5;
  --star: #e3b256; --good: #7fd4a0; --good-soft: #16301f; --warn: #e6bd6b; --warn-soft: #33280e; --danger: #f1a39d;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; font-size: 106.25%; -webkit-text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); overscroll-behavior: none;
  font-family: var(--font-ui); font-size: 1rem; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px;
  padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: 2px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--font-read); font-size: 1.25rem; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }
.status { color: var(--muted); font-size: .8125rem; min-width: 0; line-height: 1.3; }
.top .iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 44px; height: 44px; }
.iconbtn {
  width: 48px; height: 48px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 14px; background: transparent; color: var(--text);
}
.iconbtn:active { background: var(--surface-2); }
.iconbtn.on { color: var(--star); }
.iconbtn.on svg { fill: currentColor; }
.main {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 4px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.main:focus { outline: none; }
.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 10px));
}
.tabs button {
  min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; background: transparent; color: var(--muted); font-size: .75rem;
}
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }

.view { display: flex; flex-direction: column; }
.viewtitle { font-family: var(--font-read); font-size: 1.5rem; line-height: 1.2; font-weight: 600; margin: 8px 0 18px; text-wrap: balance; }
.label { color: var(--muted); font-size: .8125rem; letter-spacing: .01em; margin: 0 2px 8px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.cardhead .iconbtn { margin: -10px -12px -10px 0; }
.chip {
  display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--on-accent-soft); font-size: .8125rem; font-weight: 600;
}
.chip.plain { background: var(--surface-2); color: var(--muted); }
.title { font-family: var(--font-read); font-size: 1.35rem; line-height: 1.25; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.text { font-size: 1.0625rem; line-height: 1.55; overflow-wrap: anywhere; }
.lead { color: var(--muted); }
.mnemonic { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .9375rem; }
.mnemonic b { display: block; color: var(--muted); font-size: .75rem; font-weight: 600; letter-spacing: .02em; }
.note { color: var(--muted); font-size: .8125rem; }
.statusnote { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: .875rem; }
.glyph { color: var(--star); width: 40px; height: 40px; }

.btn {
  min-height: 50px; padding: 8px 18px; border-radius: 13px; border: 1px solid transparent; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--text); }
.btn.quiet { background: transparent; color: var(--accent); padding-inline: 10px; }
.btn.link { min-height: 44px; padding: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: .875rem; text-decoration: underline; text-underline-offset: 3px; }
.btn:active { opacity: .82; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 8rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  width: 100%; min-height: 54px; padding: 12px 14px; text-align: left; border: 1px solid var(--line); border-radius: 13px;
  background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow-wrap: anywhere;
}
.option:active { background: var(--surface-2); }
.option[disabled] { cursor: default; opacity: 1; }
.option.correct { background: var(--good-soft); border-color: var(--good); }
.option.chosen { background: var(--warn-soft); border-color: var(--warn); }
.option small { flex: none; font-weight: 650; font-size: .75rem; }
.option.correct small { color: var(--good); }
.option.chosen small { color: var(--warn); }
.feedback b { display: block; font-size: 1.0625rem; }
.feedback.right b { color: var(--good); }
.feedback.almost b { color: var(--warn); }
.big { font-family: var(--font-read); font-size: 2rem; line-height: 1.15; font-weight: 600; }

.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.pill {
  min-height: 60px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 13px; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: .8125rem; min-width: 0;
}
.pill b { font-size: .875rem; }
.pill span { color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.done span { color: var(--good); }
.pill[aria-current="true"] { border-color: var(--accent); background: var(--surface); }
.pill[disabled] { cursor: default; }
.under { display: flex; flex-direction: column; margin-top: 6px; }
.lineitem {
  width: 100%; min-height: 50px; padding: 10px 2px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; font-size: .9375rem;
}
.lineitem b { color: var(--accent); font-weight: 650; }
.under .lineitem:first-child { margin-top: 12px; }

.search input, .field input, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); font-size: max(1rem, 16px);
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .fieldlabel { font-size: .875rem; font-weight: 600; }
.hint { color: var(--muted); font-size: .8125rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: .875rem;
}
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--on-accent-soft); font-weight: 650; }
.dayhead { color: var(--muted); font-size: .8125rem; margin: 18px 2px 2px; }
.item {
  width: 100%; min-height: 58px; padding: 10px 2px; display: flex; align-items: center; gap: 12px; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: transparent;
}
.item > div { flex: 1; min-width: 0; }
.item strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item small { color: var(--muted); font-size: .8125rem; }
.item svg { color: var(--muted); width: 20px; height: 20px; }
.item .mark { color: var(--star); fill: currentColor; }
.empty { color: var(--muted); padding: 24px 2px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; max-width: 34rem; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--bg); border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px); touch-action: pan-y;
  transition: transform .22s ease-out;
}
.sheethead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet.dragging { transition: none; }
.sheethead h2 { font-size: 1.0625rem; font-weight: 650; overflow-wrap: anywhere; }
.sheetbody {
  overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 6px 28px; display: flex; flex-direction: column; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 13px; }
.seg button { min-height: 44px; padding: 4px 6px; border: 0; border-radius: 10px; background: transparent; font-size: .875rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section h3 { font-size: .9375rem; font-weight: 650; }
.arearow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.arearow .line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.arearow .line span { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; text-align: right; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switchrow input { width: 52px; height: 32px; accent-color: var(--accent); }
.newsitem { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.newsitem h3 { font-family: var(--font-read); font-size: 1.125rem; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.newsitem .meta { color: var(--muted); font-size: .8125rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.newsitem a, .answer a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.answer { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.msg { border-radius: 14px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { background: var(--accent-soft); color: var(--on-accent-soft); align-self: flex-end; max-width: 90%; }
.msg.claude { background: var(--surface); border: 1px solid var(--line); }
.chat { display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); padding: 10px 16px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: .9375rem; text-align: center;
}
.haptic { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; }
  .scrim { animation: fade .2s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
[hidden] { display: none !important; }
.notice { margin-bottom: 14px; border-color: var(--accent); }
.notice .label { margin: 0; color: var(--accent); }
.authlinks { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.formerror { color: var(--danger); font-size: .875rem; }
.field input[type="file"] { padding: 10px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Lumen</b><p class="status" id="statusLine" aria-live="polite"></p></div>
    <button class="iconbtn" id="btnProgress" type="button" aria-label="Fortschritt und Einstellungen öffnen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
    </button>
  </header>
  <main class="main" id="main" tabindex="-1">
    <section class="view" id="viewToday" aria-label="Heute"></section>
    <section class="view" id="viewPractice" aria-label="Üben" hidden></section>
    <section class="view" id="viewArchive" aria-label="Archiv" hidden>
      <h1 class="viewtitle">Archiv</h1>
      <div class="search">
        <label class="sr" for="archiveSearch">Im Archiv suchen</label>
        <input id="archiveSearch" type="search" placeholder="Suchen" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips" id="archiveChips" role="group" aria-label="Filter"></div>
      <div id="archiveList"></div>
    </section>
  </main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <button type="button" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <span>Heute</span>
    </button>
    <button type="button" data-tab="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.7L4 16M4 20v-4h4"/></svg>
      <span>Üben</span>
    </button>
    <button type="button" data-tab="archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 8-4 8 4-8 4-8-4ZM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>
      <span>Archiv</span>
    </button>
  </nav>
</div>
<div id="sheets"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<label class="haptic" id="hapticLabel" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="lumen-cloud.js"></script>
<script id="lumen-logic">
/* Lumen logic: pure functions only (no DOM, no storage, no network).
   Tested by tests/logic.test.mjs, which reads this block from index.html. */
(function (root) {
  'use strict';

  const TZ = 'Europe/Vienna';
  const INTERVALS = [1, 3, 7, 21, 60, 180];
  const BLOCKS = ['morgen', 'mittag', 'abend'];
  const BLOCK_NAMES = { morgen: 'Morgen', mittag: 'Mittag', abend: 'Abend' };
  const DEFAULT_TIMES = { morgen: '07:00', mittag: '12:00', abend: '18:00' };
  const QUIZ_LIMIT = 10;
  const CATCHUP_DAYS = 7;
  const RECENT_LIMIT = 30;
  const AREAS = [
    { key: 'geld', name: 'Geld & Finanzen', short: 'Geld', type: 'alltag' },
    { key: 'recht', name: 'Recht & Verträge (Österreich)', short: 'Recht', type: 'alltag' },
    { key: 'gesundheit', name: 'Körper, Gesundheit & Psyche', short: 'Gesundheit', type: 'alltag' },
    { key: 'haushalt', name: 'Haushalt, Kochen & Hacks', short: 'Haushalt', type: 'alltag' },
    { key: 'digital', name: 'Digitale Sicherheit & Internet', short: 'Digital', type: 'alltag' },
    { key: 'verkehr', name: 'Auto, Verkehr & Reisen', short: 'Verkehr', type: 'alltag' },
    { key: 'tech', name: 'Tech & Geräte', short: 'Tech', type: 'tech' },
    { key: 'erklaert', name: 'Wie funktioniert das?', short: 'Erklärt', type: 'erklaert' },
    { key: 'natur', name: 'Natur & Wissenschaft', short: 'Natur', type: 'welt' },
    { key: 'geschichte', name: 'Geschichte & Politik', short: 'Geschichte', type: 'welt' },
    { key: 'kultur', name: 'Geografie, Kultur & Sprache', short: 'Kultur', type: 'welt' },
    { key: 'denken', name: 'Denken, Psychologie & Kommunikation', short: 'Denken', type: 'welt' }
  ];
  const AREA_BY_KEY = {};
  AREAS.forEach(function (a) { AREA_BY_KEY[a.key] = a; });
  const NEWS_AREAS = { recht: 'Recht', wirtschaft: 'Wirtschaft', politik: 'Politik', welt: 'Welt', tech: 'Tech' };
  const MONTHS = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const MONTHS_SHORT = ['Jän.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'];
  const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

  /* ---------- date and time (always Europe/Vienna) ---------- */

  let viennaFormat = null;
  function viennaParts(date) {
    if (!viennaFormat) {
      viennaFormat = new Intl.DateTimeFormat('en-CA', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      });
    }
    const p = {};
    viennaFormat.formatToParts(date).forEach(function (part) { p[part.type] = part.value; });
    let hour = Number(p.hour);
    if (hour === 24) hour = 0;
    const minute = Number(p.minute);

  function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }

  function addDays(dateStr, n) { return new Date(toUTC(dateStr) + n * 86400000).toISOString().slice(0, 10); }

  function todayStr(now) { return viennaParts(now).date; }
  function yesterdayStr(now) { return addDays(todayStr(now), -1); }
  function weekdayOf(dateStr) { return new Date(toUTC(dateStr)).getUTCDay(); }
  function dateOfISO(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '' : viennaParts(d).date;
  }
  function parseTime(s) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    const h = Number(m[1]), min = Number(m[2]);
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }
  function formatDay(dateStr, opts) {
    if (!isDateStr(dateStr)) return '';

    const o = opts || {};

  }

  /* ---------- facts and learning state ---------- */

  function factDate(factId) { return String(factId).slice(0, 10); }
  function monthDocId(dateOrFactId) { return 'm_' + String(dateOrFactId).slice(0, 7); }
  function bySlot(a, b) { return (a.slot || 0) - (b.slot || 0); }
  function byDateSlot(a, b) { return a.date === b.date ? bySlot(a, b) : (a.date < b.date ? -1 : 1); }

  /* A day document holds its facts in "items" keyed "1".."5". */
  function factsOfDayDoc(doc) {
    if (!doc || !doc.items || typeof doc.items !== 'object') return [];

      .filter(function (f) { return f && typeof f === 'object' && f.id && f.title; })
      .sort(bySlot);
  }
  function collectState(monthDocs) {
    const states = {}, days = {};
    (monthDocs || []).forEach(function (doc) {
      if (!doc) return;
      const f = doc.facts || {}, d = doc.days || {};
      Object.keys(f).forEach(function (id) { if (f[id]) states[id] = f[id]; });
      Object.keys(d).forEach(function (day) { if (d[day]) days[day] = d[day]; });
    });
    return { states: states, days: days };
  }
  function isSeen(st) { return !!(st && st.seenAt); }
  function isKnown(st) { return !!(st && st.known); }
  function isHandled(st) { return isSeen(st) || isKnown(st); }
  function isDue(st, today) { return !!(st && st.seenAt && !st.known && !st.skip && st.due && st.due <= today); }
  /* The first quiz after reading (Quiz zum Vortag) is still open. Random practice does not count as that quiz.
     Older states without firstQuizDone count as done once they climbed a box. */
  function firstQuizPending(st) { return !!st && !st.firstQuizDone && !(st.lastReviewed && (st.box || 0) > 0); }
  function quizzable(fact) {
    const q = fact && fact.quiz;
    return !!(fact && !fact.retired && q && typeof q.question === 'string' && q.question &&
      Array.isArray(q.options) && q.options.length === 4 &&
      Number.isInteger(q.correct) && q.correct >= 0 && q.correct <= 3);
  }

  /* ---------- Leitner scheduling ---------- */

  function afterRead(st, nowISO, today, area) {
    const prev = st || {};
    if (prev.seenAt && !prev.known) return prev;
    return {
      area: area || prev.area || '', seenAt: prev.seenAt || nowISO, box: 0, due: addDays(today, 1),
      correct: prev.correct || 0, wrong: prev.wrong || 0, lastReviewed: prev.lastReviewed || null,
      known: false, starred: !!prev.starred
    };
  }
  function afterKnown(st, nowISO, area) {
    const prev = st || {};
    return Object.assign({}, prev, { area: area || prev.area || '', seenAt: prev.seenAt || nowISO, known: true, starred: !!prev.starred });
  }
  function afterUnknown(st, today) {
    const prev = st || {};
    const next = Object.assign({}, prev, { known: false });
    if (next.seenAt && (!Number.isInteger(next.box) || !next.due)) {
      next.box = 0;
      next.due = addDays(today, 1);
      next.correct = next.correct || 0;
      next.wrong = next.wrong || 0;
      next.lastReviewed = next.lastReviewed || null;
    }
    return next;
  }
  function afterAnswer(st, correct, nowISO, today, kind) {
    const prev = st || {};
    const wasDue = !!(prev.due && prev.due <= today);
    const next = Object.assign({}, prev, { lastReviewed: nowISO });
    if (kind === 'vortag' || (kind === 'refresh' && wasDue)) next.firstQuizDone = today;
    if (correct) {
      next.correct = (prev.correct || 0) + 1;
      if (wasDue) {
        next.box = Math.min((prev.box || 0) + 1, INTERVALS.length - 1);
        next.due = addDays(today, INTERVALS[next.box]);
      }
    } else {
      next.wrong = (prev.wrong || 0) + 1;
      next.box = 0;
      next.due = addDays(today, 1);

    return next;
  }
  function toggleStar(st, area) {
    const prev = st || {};
    return Object.assign({}, prev, { area: area || prev.area || '', starred: !prev.starred });
  }

  /* ---------- what is due ---------- */

  function byDueThenId(states) {
    return function (a, b) {
      const da = states[a].due, db = states[b].due;
      if (da !== db) return da < db ? -1 : 1;
      return a < b ? -1 : (a > b ? 1 : 0);
    };
  }
  /* First review: due facts that were never asked. Oldest first. */
  function selectVortag(states, today, limit) {
    const ids = Object.keys(states || {}).filter(function (id) { return isDue(states[id], today) && firstQuizPending(states[id]); });
    ids.sort(byDueThenId(states));
    return typeof limit === 'number' ? ids.slice(0, Math.max(0, limit)) : ids;
  }
  /* Refresh: due facts that were asked before. With includeUnreviewed the
     leftovers of the daily quiz join once that quiz is done for today. */
  function selectRefresh(states, today, includeUnreviewed) {
    const ids = Object.keys(states || {}).filter(function (id) {
      return isDue(states[id], today) && (includeUnreviewed || !firstQuizPending(states[id]));
    });
    ids.sort(byDueThenId(states));
    return ids;
  }
  function quizBudget(dayRec) {
    const rec = dayRec || {};
    if (rec.quizDone) return 0;
    return Math.max(0, QUIZ_LIMIT - (rec.quizCount || 0));
  }
  /* Unread facts of the last seven days (not today), never from before the person started. */
  function selectCatchup(facts, states, today, startDate) {
    let from = addDays(today, -CATCHUP_DAYS);
    if (isDateStr(startDate) && startDate > from) from = startDate;
    return (facts || []).filter(function (f) {
      return f && !f.retired && f.date >= from && f.date < today && !isHandled((states || {})[f.id]);
    }).sort(byDateSlot);
  }

  /* ---------- random practice ---------- */

  function randomWeight(st, today) {
    if (!st) return 0;
    const last = dateOfISO(st.lastReviewed || st.seenAt);
    const days = last ? Math.max(0, diffDays(today, last)) : 0;
    const total = (st.correct || 0) + (st.wrong || 0);
    const wrongRatio = total ? (st.wrong || 0) / total : 0;
    return 1 + Math.min(days, 365) / 30 + 3 * wrongRatio + 0.3 * Math.min(st.wrong || 0, 5) + (st.starred ? 1.5 : 0);
  }
  /* Weighted order without repetition (Efraimidis-Spirakis). */
  function randomOrder(states, today, rng, exclude) {
    const skip = exclude || {};
    const rand = rng || Math.random;
    return Object.keys(states || {}).filter(function (id) {
      return isSeen(states[id]) && !isKnown(states[id]) && !states[id].skip && !skip[id];
    }).map(function (id) {
      const w = Math.max(randomWeight(states[id], today), 1e-6);
      const u = Math.min(Math.max(rand(), 1e-12), 1 - 1e-12);
      return { id: id, key: Math.pow(u, 1 / w) };

      .map(function (x) { return x.id; });
  }

  /* ---------- stages of the day ---------- */

  function blockUnlocked(block, times, minutes, unlockedEarly) {
    const t = parseTime((times && times[block]) || DEFAULT_TIMES[block]);
    const at = t === null ? parseTime(DEFAULT_TIMES[block]) : t;
    return minutes >= at || (Array.isArray(unlockedEarly) && unlockedEarly.indexOf(block) !== -1);
  }
  function todayModel(input) {
    const states = input.states || {};
    const rec = (input.days || {})[input.today] || {};
    const dayFacts = (input.dayFacts || []).filter(function (f) { return f && f.date === input.today && !f.retired; });
    const blocks = BLOCKS.map(function (block) {
      const facts = dayFacts.filter(function (f) { return f.block === block; }).sort(bySlot);
      const open = facts.filter(function (f) { return !isHandled(states[f.id]); });
      return {
        block: block, name: BLOCK_NAMES[block], facts: facts, open: open, total: facts.length,
        done: facts.length > 0 && open.length === 0,
        unlocked: blockUnlocked(block, input.times, input.minutes, rec.unlocked),
        time: (input.times && input.times[block]) || DEFAULT_TIMES[block]
      };
    });
    const withFacts = blocks.filter(function (b) { return b.total > 0; });
    return {
      today: input.today, blocks: blocks, hasFacts: withFacts.length > 0,
      allDone: withFacts.length > 0 && withFacts.every(function (b) { return b.done; })

  }
  /* The one next step shown on "Heute". */
  function nextStep(model, pending) {
    const p = pending || {};
    if (p.quiz > 0) return { type: 'quiz', count: p.quiz };
    if (p.catchup > 0) return { type: 'catchup', count: p.catchup };
    const withFacts = model.blocks.filter(function (b) { return b.total > 0; });
    if (!withFacts.length) return { type: 'empty' };
    const open = withFacts.filter(function (b) { return !b.done && b.unlocked; })[0];
    if (open) return { type: 'stage', block: open.block };
    const locked = withFacts.filter(function (b) { return !b.done; })[0];
    if (locked) return { type: 'locked', block: locked.block, time: locked.time };

  }
  function isReleased(fact, today, minutes, times, dayRec) {
    if (!fact || !isDateStr(fact.date)) return false;
    if (fact.date < today) return true;
    if (fact.date > today) return false;
    return blockUnlocked(fact.block, times, minutes, (dayRec || {}).unlocked);
  }

  /* ---------- streak and counters ---------- */

  function dayCounts(rec) {
    return !!(rec && ((Array.isArray(rec.blocksDone) && rec.blocksDone.length > 0) || rec.quizDone || rec.practiced));
  }
  function streak(days, today) {
    const d = days || {};
    let cur = dayCounts(d[today]) ? today : addDays(today, -1);
    let n = 0;
    while (dayCounts(d[cur])) { n += 1; cur = addDays(cur, -1); }

  }
  function learnedCount(states) {
    return Object.keys(states || {}).filter(function (id) { return isSeen(states[id]) && !isKnown(states[id]); }).length;
  }
  function statusLine(streakDays, learned) {
    const parts = [];
    if (streakDays > 0) parts.push(streakDays === 1 ? '1 Tag in Folge' : streakDays + ' Tage in Folge');
    if (learned > 0) parts.push(learned === 1 ? '1 Fakt gelernt' : learned + ' Fakten gelernt');

  /* ---------- knowledge map and digest ---------- */

  function pushRecent(list, correct) {
    return (Array.isArray(list) ? list : []).concat([correct ? 1 : 0]).slice(-RECENT_LIMIT);
  }
  function areaStats(states, stats) {
    const out = {};
    AREAS.forEach(function (a) { out[a.key] = { read: 0, answered: 0, pct: null }; });
    Object.keys(states || {}).forEach(function (id) {
      const st = states[id];
      if (isSeen(st) && !isKnown(st) && out[st.area]) out[st.area].read += 1;
    });
    const areas = (stats && stats.areas) || {};
    AREAS.forEach(function (a) {
      const recent = (areas[a.key] && Array.isArray(areas[a.key].recent)) ? areas[a.key].recent : [];
      out[a.key].answered = recent.length;

        const right = recent.reduce(function (s, v) { return s + (v ? 1 : 0); }, 0);

  }
  function knownIds(states, limit) {
    return Object.keys(states || {}).filter(function (id) { return isKnown(states[id]); })
      .sort(function (a, b) {
        const sa = states[a].seenAt || '', sb = states[b].seenAt || '';
        return sa === sb ? (a < b ? 1 : -1) : (sa < sb ? 1 : -1);

  }
  function normalizeWeights(weights) {
    const out = {};
    AREAS.forEach(function (a) {
      const w = weights ? Number(weights[a.key]) : 1;
      out[a.key] = (w === 0.5 || w === 2) ? w : 1;

  }
  function buildDigest(input) {
    const settings = input.settings || {};

    return {
      wish: String(settings.wish || '').slice(0, 300),
      areaWeights: normalizeWeights(settings.areaWeights),
      settingsChangedAt: settings.settingsChangedAt || null,
      knownIds: knownIds(input.states, 200),
      areaAccuracy: acc,

  function pickNews(editions, today, newsSeen) {
    const list = (editions || []).filter(function (e) {

    }).sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

      latest: latest, stand: latest.date,

  }
  function newsLine(pick) {
    if (!pick) return '';

    return s;
  }
  function safeUrl(url) { return /^https?:\/\/[^\s]+$/i.test(String(url || '')) ? String(url) : ''; }

  /* ---------- error reports and research questions ---------- */

  function isReportHandled(report, handledUntil) {
    return !!(report && handledUntil && report.reportedAt && report.reportedAt <= handledUntil);
  }
  function reportStatus(report, fact, handledUntil) {
    if (!report) return null;
    if (!isReportHandled(report, handledUntil)) return 'offen';
    if (fact && fact.retired) return 'zurueckgezogen';
    if (fact && fact.correction && fact.correction.at &&
        String(fact.correction.at).slice(0, 10) >= String(report.reportedAt).slice(0, 10)) return 'korrigiert';
    return 'geprueft';
  }
  function reportStatusText(status, fact) {
    if (status === 'offen') return 'Gemeldet, wird am Sonntag geprüft';
    if (status === 'zurueckgezogen') return 'Zurückgezogen';
    if (status === 'korrigiert') return 'Korrigiert am ' + formatDay(String(fact.correction.at).slice(0, 10), { year: true });
    if (status === 'geprueft') return 'Geprüft, keine Änderung nötig';
    return '';
  }
  function openReports(reports, handledUntil) {
    return (reports || []).filter(function (r) { return !isReportHandled(r, handledUntil); });
  }
  function latestReport(reports, factId) {
    const list = (reports || []).filter(function (r) { return r && r.factId === factId; });
    list.sort(function (a, b) { return a.reportedAt < b.reportedAt ? 1 : -1; });
    return list[0] || null;
  }
  function researchStatus(entry, answers) { return (answers && entry && answers[entry.id]) ? 'beantwortet' : 'wartet'; }
  function openResearch(research, answers) {
    return (research || []).filter(function (r) { return researchStatus(r, answers) === 'wartet'; });
  }

  /* ---------- archive search ---------- */

  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
  }
  function matchesQuery(fact, query) {
    const q = norm(query).trim();
    if (!q) return true;

    return q.split(/\s+/).every(function (word) { return hay.indexOf(word) !== -1; });
  }

  function mergeIdx(idxDocs) {
    const out = {};
    (idxDocs || []).slice().sort(function (a, b) { return String(a.id) < String(b.id) ? -1 : 1; }).forEach(function (doc) {
      const topics = (doc && doc.topics) || {};
      Object.keys(topics).forEach(function (area) {
        const map = topics[area] || {};
        Object.keys(map).forEach(function (id) { out[id] = { area: area, kw: String(map[id]) }; });
      });
    });
    return out;
  }
  function searchIdx(merged, query, today) {
    const q = norm(query).trim();

    const words = q.split(/\s+/);
    return Object.keys(merged || {}).filter(function (id) {
      if (factDate(id) > today) return false;
      const hay = norm(merged[id].kw);
      return words.every(function (w) { return hay.indexOf(w) !== -1; });

  }

  /* ---------- haptics ---------- */

  /* env: { isEnabled(): boolean, vibrate?: fn, getLabel(): element|null, setTimeout?: fn }.
     Never throws. Returns true when a tick was triggered. */
  function makeTick(env) {
    return function tick(kind) {
      try {
        if (!env || typeof env.isEnabled !== 'function' || !env.isEnabled()) return false;
        const twice = kind === 'double';

          env.vibrate(twice ? [10, 70, 10] : 10);

        const label = typeof env.getLabel === 'function' ? env.getLabel() : null;
        if (!label || typeof label.click !== 'function') return false;

        if (twice) {
          const later = typeof env.setTimeout === 'function' ? env.setTimeout : setTimeout;
          later(function () { try { label.click(); } catch (e) { /* ignore */ } }, 80);
        }

      } catch (e) {
        return false;
      }

  }

  const api = {
    TZ: TZ, INTERVALS: INTERVALS, BLOCKS: BLOCKS, BLOCK_NAMES: BLOCK_NAMES, DEFAULT_TIMES: DEFAULT_TIMES,
    QUIZ_LIMIT: QUIZ_LIMIT, CATCHUP_DAYS: CATCHUP_DAYS, AREAS: AREAS, AREA_BY_KEY: AREA_BY_KEY, NEWS_AREAS: NEWS_AREAS,
    viennaParts: viennaParts, isDateStr: isDateStr, addDays: addDays, diffDays: diffDays, todayStr: todayStr,
    yesterdayStr: yesterdayStr, weekdayOf: weekdayOf, dateOfISO: dateOfISO, parseTime: parseTime, formatDay: formatDay,
    factDate: factDate, monthDocId: monthDocId, bySlot: bySlot, byDateSlot: byDateSlot, factsOfDayDoc: factsOfDayDoc,
    collectState: collectState, isSeen: isSeen, isKnown: isKnown, isHandled: isHandled, isDue: isDue, firstQuizPending: firstQuizPending, quizzable: quizzable,
    afterRead: afterRead, afterKnown: afterKnown, afterUnknown: afterUnknown, afterAnswer: afterAnswer, toggleStar: toggleStar,
    selectVortag: selectVortag, selectRefresh: selectRefresh, quizBudget: quizBudget, selectCatchup: selectCatchup,
    randomWeight: randomWeight, randomOrder: randomOrder,
    blockUnlocked: blockUnlocked, todayModel: todayModel, nextStep: nextStep, isReleased: isReleased,
    dayCounts: dayCounts, streak: streak, learnedCount: learnedCount, statusLine: statusLine,
    pushRecent: pushRecent, areaStats: areaStats, knownIds: knownIds, normalizeWeights: normalizeWeights,
    buildDigest: buildDigest, sameDigest: sameDigest,
    pickNews: pickNews, newsLine: newsLine, safeUrl: safeUrl,
    isReportHandled: isReportHandled, reportStatus: reportStatus, reportStatusText: reportStatusText,
    openReports: openReports, latestReport: latestReport, researchStatus: researchStatus, openResearch: openResearch,
    norm: norm, matchesQuery: matchesQuery, mergeIdx: mergeIdx, searchIdx: searchIdx,
    makeTick: makeTick
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.LumenLogic = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  /* ---------- sign-in ---------- */

  /* Swipe a sheet down to close it: from the handle or header, or from the content when it is scrolled to the top. */
  function dragToClose(sheet) {

    let y0 = null, x0 = 0, dy = 0, t0 = 0, active = false;
    panel.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      const inBody = sheet.body.contains(e.target);
      if (inBody && (sheet.body.scrollTop > 0 || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); active = false;
    }, { passive: true });
    panel.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      const ty = e.touches[0].clientY - y0, tx = e.touches[0].clientX - x0;
      if (!active) {
        if (Math.abs(tx) > Math.abs(ty) || ty < 6) { if (ty < -6 || Math.abs(tx) > 10) y0 = null; return; }
        active = true;
        panel.classList.add('dragging');
      }
      dy = Math.max(0, ty);
      panel.style.transform = 'translateY(' + dy + 'px)';
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    const end = function () {
      if (y0 === null) return;
      y0 = null;
      if (!active) return;
      panel.classList.remove('dragging');
      const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
      if (dy > Math.min(140, panel.offsetHeight * 0.3) || fast) {
        panel.style.transform = 'translateY(100%)';
        setTimeout(function () { closeSheet(sheet); }, 180);
      } else panel.style.transform = '';
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  }
  function closeSheet(sheet) {
    const i = S.sheets.indexOf(sheet);
    if (i === -1) return;
    S.sheets.splice(i, 1);
    sheet.scrim.remove();
    sheet.panel.remove();
    if (sheet.onclose) sheet.onclose();
    try { if (sheet.opener && document.contains(sheet.opener)) sheet.opener.focus(); } catch (e) { /* ignore */ }
  }

  function openDetail(factId) {
    const sheet = openSheet('Fakt', function () {
      const f = factById(factId);
      if (!f) return h('p', { class: 'empty', text: 'Dieser Fakt ist nicht mehr verfügbar.' });
      const st = S.ls.states[factId];
      const report = L.latestReport(S.lists.reports, factId);
      const status = L.reportStatus(report, f, S.handledUntil);
      const notes = [];
      if (f.retired) notes.push('Zurückgezogen');
      else if (f.correction && f.correction.at) notes.push('Korrigiert am ' + L.formatDay(String(f.correction.at).slice(0, 10), { year: true }) + (f.correction.summary ? ': ' + f.correction.summary : ''));
      if (status === 'offen' || status === 'geprueft') notes.push(L.reportStatusText(status, f));
      const state = L.isKnown(st) ? 'als bekannt markiert' : (L.isSeen(st) ? 'gelesen' : 'noch nicht gelesen');
      return h('article', { class: 'card' }, factBody(f, st),
        h('p', { class: 'note', text: L.formatDay(f.date, { long: true, year: true }) + ' · ' + state }),
        notes.map(function (n) { return h('p', { class: 'statusnote', text: n }); }),
        !f.retired && !L.isHandled(st) ? btn('Als gelesen markieren', 'primary', function () {
          saveState(f.id, L.afterRead(st, nowISO(), today(), f.area)); bumpRead(f.area); touchDigest();
        }) : null,
        h('div', { class: 'row' },
          btn(L.isKnown(st) ? 'Doch nicht bekannt' : 'Kenn ich schon', 'secondary', function () {
            saveState(f.id, L.isKnown(st) ? L.afterUnknown(st, today()) : L.afterKnown(st, nowISO(), f.area)); bumpRead(f.area); touchDigest();
          }),
          btn('Frag Claude dazu', 'secondary', function () { openAsk(askOfFact(f)); })),
        btn('Fehler melden', 'link', function () { openReport(f); }));
    }, true);
    return sheet;
  }

  function openReport(f) {
    let sent = false;
    const note = h('textarea', { id: 'reportNote', maxlength: '200', rows: '3', placeholder: 'Was stimmt nicht? (optional)' });
    const sheet = openSheet('Fehler melden', function () {
      if (sent) return [h('p', { class: 'text', text: 'Gemeldet, wird am Sonntag geprüft.' }), btn('Schließen', 'primary', function () { closeSheet(sheet); })];
      return [h('p', { class: 'lead', text: f.title }),
        h('label', { class: 'field' }, h('span', { text: 'Hinweis' }), note),
        h('p', { class: 'hint', text: 'Die Wochenaufgabe prüft den Fakt am nächsten Sonntag anhand von Quellen.' }),
        btn('Senden', 'primary', function () {
          if (!S.digestLoaded) { toast('Das geht gerade nicht. Bitte später noch einmal versuchen.'); return; }
          if (L.openReports(S.lists.reports, S.handledUntil).length >= 20) { toast('Es sind schon 20 Meldungen offen. Sie werden am Sonntag bearbeitet.'); return; }
          const cutoff = L.addDays(today(), -60);
          S.lists.reports = S.lists.reports.filter(function (r) {
            return !L.isReportHandled(r, S.handledUntil) || String(r.reportedAt).slice(0, 10) >= cutoff;
          }).concat([{ factId: f.id, note: note.value.trim().slice(0, 200), reportedAt: nowISO() }]);
          flushDigest();
          sent = true;
          sheet.draw();
          scheduleRender();
        })];
    });
  }

  /* ---------- Frag Claude dazu: opens Claude with the entry as context ---------- */

  function askOfFact(f) {
    const a = L.AREA_BY_KEY[f.area];
    return { kind: 'fact', id: f.id, title: f.title, area: a ? a.name : f.area, text: f.text + (f.mnemonic ? '\nMerksatz: ' + f.mnemonic : ''), source: '' };
  }
  function askOfNews(n) {
    return { kind: 'news', id: n.id, title: n.title, area: 'Aktuell, ' + (L.NEWS_AREAS[n.area] || n.area), text: n.text + '\nDatum: ' + n.date, source: n.source ? n.source.name + ' – ' + n.source.url : '' };
  }
  function askPrompt(ctx, question) {
    return 'Ich lerne mit der App „Lumen“ und habe eine Rückfrage zu diesem Eintrag. Antworte bitte auf Deutsch, kurz und verständlich, ' +
      'und sag es klar, wenn du unsicher bist. Ich lebe in Österreich.\n\n' +
      'Bereich: ' + ctx.area + '\nTitel: ' + ctx.title + '\nText: ' + ctx.text + (ctx.source ? '\nQuelle: ' + ctx.source : '') +
      '\n\nMeine Frage: ' + (question || '');
  }
  function openAsk(ctx) {
    const input = h('textarea', { id: 'askInput', rows: '3', maxlength: '400', placeholder: 'Deine Frage (du kannst sie auch erst in Claude eintippen)' });
    openSheet('Frag Claude dazu', function () {
      return [h('p', { class: 'lead', text: ctx.title }),
        h('label', { class: 'field' }, h('span', { class: 'sr', text: 'Deine Frage' }), input),
        h('a', { class: 'btn primary', href: '#', role: 'button', text: 'In Claude öffnen', onclick: function (e) {
          e.preventDefault();
          window.open('https://claude.ai/new?q=' + encodeURIComponent(askPrompt(ctx, input.value.trim())), '_blank', 'noopener');
        } }),
        h('p', { class: 'hint', text: 'Öffnet Claude mit diesem Eintrag als Hintergrund. Dafür brauchst du ein eigenes Claude-Konto, das kostenlose reicht.' })];
    });
  }

  /* ---------- Aktuell ---------- */

  function sourceLink(src) {
    const url = L.safeUrl(src && src.url);
    if (!url) return src && src.name ? h('span', { text: 'Quelle: ' + src.name }) : null;
    return h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: 'Quelle: ' + (src.name || url) });
  }
  function openNews() {
    const pick = L.pickNews(S.news, today(), settings().newsSeen);
    if (pick && pick.isNew) writePriv('settings', { newsSeen: pick.stand });
    let shown = pick ? pick.latest : null;
    const sheet = openSheet('Aktuell', function () {
      const out = [];
      if (shown) {
        out.push(h('p', { class: 'hint', text: 'Stand ' + L.formatDay(shown.date, { year: true }) + '. Die Rubrik erscheint sonntags neu und ist nicht tagesaktuell.' }));
        out.push(h('div', {}, shown.items.map(function (n) {
          return h('div', { class: 'newsitem' },
            h('div', { class: 'meta' }, h('span', { class: 'chip plain', text: L.NEWS_AREAS[n.area] || n.area }),
              h('span', { text: (n.upcoming ? 'gilt ab ' : '') + L.formatDay(n.date, { year: true }) })),
            h('h3', { text: n.title }), h('p', { class: 'text', text: n.text }),
            n.note ? h('p', { class: 'note', text: n.note }) : null,
            h('div', { class: 'meta' }, sourceLink(n.source)),
            btn('Frag Claude dazu', 'link', function () { openAsk(askOfNews(n)); }));
        })));
      } else out.push(h('p', { class: 'empty', text: 'Noch keine Ausgabe vorhanden. Die erste kommt mit der nächsten Wochenladung.' }));
      if (pick && pick.earlier.length) {
        out.push(h('div', { class: 'section' }, h('h3', { text: 'Frühere Ausgaben' }),
          h('div', { class: 'chips', style: 'padding-top:0' }, [pick.latest].concat(pick.earlier).map(function (e) {
            return h('button', { type: 'button', text: L.formatDay(e.date), 'aria-pressed': String(e === shown), onclick: function () { shown = e; sheet.draw(); sheet.body.scrollTop = 0; } });
          }))));
      }
      return out;
    });
  }

  /* ---------- Fortschritt und Einstellungen ---------- */

  function openProgress() {
    let seg = 'progress';
    const sheet = openSheet('Fortschritt und Einstellungen', function () {
      const tabs = h('div', { class: 'seg', role: 'group', 'aria-label': 'Bereich wählen' },
        [['progress', 'Fortschritt'], ['settings', 'Einstellungen']].map(function (t) {
          return h('button', { type: 'button', text: t[1], 'aria-pressed': String(seg === t[0]), onclick: function () { seg = t[0]; sheet.draw(); sheet.body.scrollTop = 0; } });
        }));
      return [tabs, seg === 'progress' ? progressView() : settingsView()];
    });
    function areaRow(a, stats, max) {
      const s = stats[a.key];
      return h('div', { class: 'arearow' },
        h('div', { class: 'line' }, h('strong', { text: a.name }),
          h('span', { text: s.read + ' gelesen' + (s.pct === null ? '' : ' · ' + s.pct + ' % richtig') })),
        h('div', { class: 'bar', role: 'presentation' }, h('i', { style: 'width:' + Math.round(100 * s.read / max) + '%' })));
    }
    function progressView() {
      const stats = L.areaStats(S.ls.states, S.priv.stats);
      const max = Math.max.apply(null, L.AREAS.map(function (a) { return stats[a.key].read; }).concat([1]));
      return h('div', { class: 'section' },
        h('p', { class: 'lead', text: L.statusLine(L.streak(S.ls.days, today()), L.learnedCount(S.ls.states)) }),
        h('p', { class: 'hint', text: 'Je Bereich: gelesene Fakten und Trefferquote deiner letzten 30 Antworten.' }),
        L.AREAS.map(function (a) { return areaRow(a, stats, max); }));
    }
    function settingsView() {
      const t = times(), u = S.authUser || {};
      const fileInput = h('input', { id: 'importFile', type: 'file', accept: 'application/json,.json', onchange: function (e) { importBackup(e.target.files && e.target.files[0]); e.target.value = ''; } });
      return [
        h('div', { class: 'section' }, h('h3', { text: 'Etappen' }),
          h('div', { class: 'times' }, L.BLOCKS.map(function (b) {
            const input = h('input', { id: 'time_' + b, type: 'time', value: t[b], onchange: function () {
              if (L.parseTime(input.value) === null) { input.value = t[b]; return; }
              const patch = { times: {} };
              patch.times[b] = input.value;
              writePriv('settings', patch);
            } });
            return h('label', { class: 'field' }, h('span', { text: L.BLOCK_NAMES[b] }), input);
          })),
          h('p', { class: 'hint', text: 'Ab diesen Uhrzeiten öffnen sich die neuen Fakten. Mit „Früher öffnen“ kannst du jederzeit vorgreifen.' })),
        h('div', { class: 'section' }, h('h3', { text: 'Haptik' }),
          h('label', { class: 'switchrow' }, h('span', { text: 'Leiser Tick bei Quizantworten' }),
            h('input', { id: 'hapticsToggle', type: 'checkbox', checked: hapticsOn(), onchange: function (e) {
              writePriv('settings', { haptics: !!e.target.checked });
              if (e.target.checked) setTimeout(function () { tick('single'); }, 0);
            } })),
          h('p', { class: 'hint', text: 'Funktioniert auf dem iPhone ab iOS 18. Passiert nichts, kannst du den Schalter ausgeschaltet lassen.' })),
        h('div', { class: 'section' }, h('h3', { text: 'Vorrat' }),
          h('p', { class: 'hint', text: S.lastFacts ? 'Vorrat reicht bis ' + L.formatDay(S.lastFacts, { long: true, year: true }) + '. Jeden Sonntag kommen neue Fakten dazu.' : 'Der Vorrat wird geprüft …' })),
        h('div', { class: 'section' }, h('h3', { text: 'Auf den Home-Bildschirm' }),
          h('p', { class: 'hint', text: 'Öffne diese Seite in Safari, tippe auf „Teilen“ und dann auf „Zum Home-Bildschirm“. Lumen startet dann wie eine App. Für tägliche Erinnerungen kannst du in der App „Erinnerungen“ drei Erinnerungen um ' + t.morgen + ', ' + t.mittag + ' und ' + t.abend + ' Uhr mit diesem Link anlegen:' }),
          h('p', { class: 'note', style: 'user-select:all;-webkit-user-select:all;overflow-wrap:anywhere', text: PAGE_URL }),
          btn('Link kopieren', 'secondary', function () {
            navigator.clipboard.writeText(PAGE_URL).then(function () { toast('Link kopiert.'); }).catch(function () { toast('Bitte den Link oben gedrückt halten und kopieren.'); });
          })),
        h('div', { class: 'section' }, h('h3', { text: 'Sicherung' }),
          h('p', { class: 'hint', text: 'Speichert deinen Lernstand und deine Einstellungen als Datei. Mit „Sicherung einspielen“ holst du einen gesicherten Stand zurück; er wird mit dem jetzigen zusammengeführt.' }),
          btn('Sicherung herunterladen', 'secondary', exportBackup),
          h('label', { class: 'field' }, h('span', { text: 'Sicherung einspielen' }), fileInput)),
        h('div', { class: 'section' }, h('h3', { text: 'Konto' }),
          h('p', { class: 'hint', text: 'Angemeldet als ' + (u.displayName ? u.displayName + ', ' : '') + (u.email || '') + '.' }),
          btn('Passwort ändern', 'secondary', function () {
            C.auth.sendPasswordResetEmail(u.email).then(function () { toast('Ein Link zum Ändern ist an ' + u.email + ' unterwegs.'); }, function (e) { toast(C.message(e)); });
          }),
          btn('Abmelden', 'secondary', signOut),
          h('p', { class: 'hint', text: 'Datenschutz: Dein Lernstand liegt in einer Datenbank in Frankfurt. Der Admin sieht deinen Lernfortschritt und deine Fehlermeldungen, aber kein Passwort. Fehlermeldungen gibt er ohne deinen Namen an die Wochenaufgabe weiter, die die Fakten prüft. Möchtest du dein Konto löschen lassen, sag dem Admin Bescheid.' }))
      ];
    }
  }
  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = h('a', { href: url, download: name, style: 'display:none' });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }
  async function exportBackup() {
    try {
      const facts = await C.content.upTo(today());
      download('lumen-sicherung-' + today() + '.json',
        JSON.stringify({ app: 'Lumen', exportedAt: nowISO(), facts: facts, learning: S.priv, digest: S.digest }, null, 1));
      toast('Sicherung erstellt.');
    } catch (e) {
      toast('Die Sicherung hat gerade nicht geklappt.');
    }
  }
  function importBackup(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let data;
      try { data = JSON.parse(String(reader.result)); } catch (e) { toast('Diese Datei ist keine Lumen-Sicherung.'); return; }
      const learning = data && data.app === 'Lumen' && isObj(data.learning) ? data.learning : null;
      const ids = learning ? Object.keys(learning).filter(function (k) { return /^(settings|stats|m_\d{4}-\d{2})$/.test(k) && isObj(learning[k]); }) : [];
      if (!ids.length) { toast('In dieser Datei ist kein Lernstand.'); return; }
      ids.forEach(function (k) { writePriv(k, learning[k]); });
      if (data.digest && Array.isArray(data.digest.reports) && S.digestLoaded) {
        S.lists.reports = S.lists.reports.concat(data.digest.reports.filter(function (r) {
          return !S.lists.reports.some(function (x) { return x.factId === r.factId && x.reportedAt === r.reportedAt; });
        }));
      }
      touchDigest();
      toast('Sicherung eingespielt.');
    };
    reader.readAsText(file);
  }

  /* ---------- events and clock ---------- */

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (S.tab === b.dataset.tab) { scrollTop(); return; }
      S.tab = b.dataset.tab;
      render();
      scrollTop();
    });
  });
  $('btnProgress').addEventListener('click', function () { if (S.phase === 'ready') openProgress(); });
  /* Swipe left or right on the page to move between Heute, Üben and Archiv. */
  (function () {
    const order = ['today', 'practice', 'archive'];
    let x0 = null, y0 = 0, t0 = 0;
    $('main').addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1 || S.phase !== 'ready' || e.target.closest('.chips, input, textarea, .options')) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    $('main').addEventListener('touchend', function (e) {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < 1.8 * Math.abs(dy) || Date.now() - t0 > 600) return;
      const i = order.indexOf(S.tab) + (dx < 0 ? 1 : -1);
      if (i < 0 || i >= order.length) return;
      S.tab = order[i];
      render();
      scrollTop();
    }, { passive: true });
  })();
  let searchTimer = 0;
  $('archiveSearch').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(function () {
      S.archive.query = value;
      S.archive.cap = 120;
      S.archive.hits = [];
      render();
      if (value.trim().length >= 3 && S.phase === 'ready') searchTopics();
    }, 250);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheets.length) closeSheet(S.sheets[S.sheets.length - 1]);
  });
  function clock() {
    S.now = new Date();
    const p = parts();
    if (S.phase === 'ready' && S.winDay && p.date !== S.winDay) {
      if (S.flow && S.flow.type === 'read') S.flow = null;
      S.later = {};
      S.pick = null;
      S.seen.win = false; S.fresh.win = false;
      subWindow();
    }
    const sig = p.date + L.BLOCKS.map(function (b) { return L.blockUnlocked(b, times(), p.minutes, dayRec().unlocked) ? '1' : '0'; }).join('');
    if (sig !== S.sig) { S.sig = sig; scheduleRender(); }
  }
  setInterval(clock, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) clock(); });

  boot();
})();
</script>
</body>
</html>
